<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>MES — Apontamento de Produção</title>
<link rel="manifest" href="manifest.json">
<style>
  /* ============ Tokens (claro / escuro) ============ */
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --ring:      rgba(11,11,11,.10);
    --accent:    #2a78d6;   /* azul — produção / métricas */
    --accent-soft: #cde2fb;
    --st-prod:   #2a78d6;   /* produzindo */
    --st-stop:   #e34948;   /* parada */
    --st-idle:   #4a3aa7;   /* ociosa (sem insumo) */
    --st-wait:   #eda100;   /* esperando linha à frente */
    --good:      #006300;
    --bad:       #d03b3b;
    --track:     #eceae4;
    --btn-ink:   #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --ring:      rgba(255,255,255,.10);
    --accent:    #3987e5;
    --accent-soft: #16324f;
    --st-prod:   #3987e5;
    --st-stop:   #e66767;
    --st-idle:   #9085e9;
    --st-wait:   #c98500;
    --good:      #0ca30c;
    --bad:       #e66767;
    --track:     #2c2c2a;
    --btn-ink:   #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --accent:#3987e5; --accent-soft:#16324f;
      --st-prod:#3987e5; --st-stop:#e66767; --st-idle:#9085e9; --st-wait:#c98500;
      --good:#0ca30c; --bad:#e66767; --track:#2c2c2a; --btn-ink:#fff;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); }

  /* ============ Header ============ */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: var(--page); border-bottom: 1px solid var(--grid);
  }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  .ver {
    font-size: 11px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--ring); border-radius: 999px; padding: 3px 8px;
    font-variant-numeric: tabular-nums;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--ring);
    display: grid; place-items: center; font-size: 16px; background: var(--surface);
  }
  .wake { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .wake .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .wake.on .dot { background: var(--good); }

  /* ============ Layout ============ */
  main { padding: 14px; display: grid; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 16px; padding: 16px;
  }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  /* ============ Tabs ============ */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    max-width: 560px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--grid);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button { padding: 10px 4px 8px; display: grid; gap: 2px; justify-items: center; color: var(--muted); font-size: 11px; font-weight: 600; }
  nav button .ico { font-size: 19px; }
  nav button.active { color: var(--accent); }
  .page { display: none; }
  .page.visible { display: grid; gap: 14px; }

  /* ============ Apontar ============ */
  .machine-pick { display: grid; gap: 8px; }
  .machine-pick button {
    text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--ring);
    background: var(--page); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .machine-pick .nm { font-weight: 700; font-size: 15px; }
  .machine-pick .rt { font-size: 12px; color: var(--muted); }

  .now-state {
    border-radius: 14px; padding: 14px 16px; color: var(--btn-ink);
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .now-state .lbl { font-size: 14px; font-weight: 700; }
  .now-state .tm { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .now-state.none { background: var(--track); color: var(--ink-2); }

  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .state-btn {
    border-radius: 14px; padding: 16px 12px; min-height: 76px;
    display: grid; gap: 3px; justify-items: center; align-content: center;
    font-weight: 800; font-size: 15px; color: var(--btn-ink);
    border: 2px solid transparent;
  }
  .state-btn small { font-size: 11px; font-weight: 600; opacity: .92; }
  .state-btn.prod { background: var(--st-prod); }
  .state-btn.stop { background: var(--st-stop); }
  .state-btn.idle { background: var(--st-idle); }
  .state-btn.wait { background: var(--st-wait); }
  .state-btn.wait { color: #221a00; }
  :root[data-theme="dark"] .state-btn.wait, :root:not([data-theme="light"]) .state-btn.wait { color: #fff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .state-btn.wait { color: #221a00; } }
  .state-btn.current { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ring); }
  .state-btn:active { transform: scale(.97); }

  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: var(--page); border: 1px solid var(--ring); border-radius: 12px; padding: 10px 12px;
  }
  .kpi .k { font-size: 11px; color: var(--muted); font-weight: 600; }
  .kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; font-weight: 600; color: var(--muted); }

  .time-list { display: grid; gap: 8px; }
  .time-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 14px; }
  .toggle-row input {
    width: 42px; height: 24px; flex: none; appearance: none; -webkit-appearance: none;
    background: var(--track); border-radius: 999px; position: relative; transition: background .15s; cursor: pointer;
  }
  .toggle-row input:checked { background: var(--accent); }
  .toggle-row input::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .toggle-row input:checked::after { left: 21px; }
  .time-row .nm { flex: 1; color: var(--ink-2); }
  .time-row .tv { font-weight: 700; font-variant-numeric: tabular-nums; }

  .btn {
    border-radius: 12px; padding: 14px; font-weight: 800; font-size: 15px;
    background: var(--accent); color: var(--btn-ink); width: 100%;
  }
  .btn.ghost { background: var(--page); color: var(--ink); border: 1px solid var(--ring); }
  .btn.danger { background: var(--bad); }
  .btn:active { transform: scale(.98); }

  /* ============ Dashboard ============ */
  .chips { display: flex; gap: 8px; overflow-x: auto; }
  .chips button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--ring);
    background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); flex: none;
  }
  .chips button.active { background: var(--accent); color: var(--btn-ink); border-color: var(--accent); }

  .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gauge { display: grid; justify-items: center; gap: 4px; min-width: 0; }
  .gauge svg { width: 100%; max-width: 104px; height: auto; }
  .gauge .glabel { font-size: 11px; font-weight: 700; color: var(--ink-2); text-align: center; }
  .gauge-hero { grid-column: 1 / -1; }
  .gauge-hero svg { max-width: 172px; }
  .gauge-hero .glabel { font-size: 12.5px; }
  .gauge .gmeta { font-size: 11px; color: var(--muted); }

  .stackbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--page); }
  .stackbar div { min-width: 3px; }
  .hbars { display: grid; gap: 10px; }
  .hbar .top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
  .hbar .top .n { color: var(--ink-2); font-weight: 600; }
  .hbar .top .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hbar .track { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 6px; background: var(--st-stop); min-width: 2px; }

  .mrow {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--grid);
  }
  .mrow:first-of-type { border-top: none; padding-top: 0; }
  .mrow svg { width: 74px; height: 74px; flex: none; }
  .mrow .info { flex: 1; min-width: 0; }
  .mrow .info .nm { font-weight: 700; font-size: 14.5px; }
  .mrow .info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mrow .mini { font-size: 11.5px; color: var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .mrow .mini b { font-weight: 700; }

  /* ============ Máquinas / forms ============ */
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select {
    padding: 12px; border-radius: 10px; border: 1px solid var(--baseline);
    background: var(--page); width: 100%;
  }
  .field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .list-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--grid);
  }
  .list-row:first-child { border-top: none; }
  .list-row .info { flex: 1; }
  .list-row .info .nm { font-weight: 700; }
  .list-row .info .sub { font-size: 12px; color: var(--muted); }
  .list-row .act { display: flex; gap: 6px; }
  .list-row .act button {
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--ring); background: var(--page); font-size: 13px;
  }
  .tagline { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagline span {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--ring); background: var(--page);
    border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 13px;
  }
  .tagline span button { color: var(--bad); font-weight: 800; padding: 0 4px; }

  /* ============ Modal / sheet ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 560px;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: grid; gap: 10px; max-height: 82vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 16px; }
  .sheet .opt {
    text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--ring);
    background: var(--page); font-weight: 600; font-size: 15px;
  }
  .sheet .opt:active { background: var(--accent-soft); }

  .empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  .diff-pos { color: var(--good); }
  .diff-neg { color: var(--bad); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; vertical-align: 2px; white-space: nowrap;
  }
  .badge.planned { background: var(--accent-soft); color: var(--accent); }
  .badge.unplanned { background: rgba(227, 73, 72, .16); color: var(--bad); }

  /* ============ Relatório executivo ============ */
  .report-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.62);
    display: none; flex-direction: column;
  }
  .report-overlay.open { display: flex; }
  .report-bar {
    display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    background: var(--surface); border-bottom: 1px solid var(--grid);
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .report-bar .btn { width: auto; flex: 1; padding: 12px 8px; font-size: 14px; }
  .report-bar .btn.close { flex: 0 0 auto; }
  .report-scroll { flex: 1; overflow: auto; padding: 12px; }
  .report-scroll svg {
    display: block; width: 100%; max-width: 900px; height: auto; margin: 0 auto;
    border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #printHost { display: none; }
  @media print {
    body.printing header, body.printing main, body.printing nav,
    body.printing .overlay, body.printing .report-overlay { display: none !important; }
    body.printing { padding: 0; max-width: none; background: #fff; }
    body.printing #printHost { display: block; }
    #printHost svg { width: 100%; height: auto; }
  }
  @page { size: A4 landscape; margin: 0; }
</style>
</head>
<body>

<header>
  <h1>MES</h1>
  <span class="wake" id="wakeInd" title="Tela sempre acesa"><span class="dot"></span>tela</span>
  <button class="icon-btn" id="themeBtn" aria-label="Alternar tema">◐</button>
  <span class="ver" id="verBadge">v0.0.0</span>
</header>

<main>
  <!-- ================= APONTAR ================= -->
  <section class="page" id="page-apontar"></section>

  <!-- ================= MANUAL ================= -->
  <section class="page" id="page-manual"></section>

  <!-- ================= DASHBOARD ================= -->
  <section class="page" id="page-dash"></section>

  <!-- ================= MÁQUINAS ================= -->
  <section class="page" id="page-maq"></section>
</main>

<nav>
  <button data-tab="apontar" class="active"><span class="ico">⏱</span>Apontar</button>
  <button data-tab="manual"><span class="ico">✎</span>Manual</button>
  <button data-tab="dash"><span class="ico">◔</span>Dashboard</button>
  <button data-tab="maq"><span class="ico">⚙</span>Máquinas</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<div class="report-overlay" id="repOverlay">
  <div class="report-bar">
    <button class="btn" id="repPng">⬇ Baixar PNG</button>
    <button class="btn ghost" id="repPdf">🖨 Salvar PDF</button>
    <button class="btn ghost close" id="repClose">✕</button>
  </div>
  <div class="report-scroll" id="repBody"></div>
</div>
<div id="printHost"></div>

<script>
/* =====================================================
   MES — Apontamento de produção, paradas e refugo
   ===================================================== */
const APP_VERSION = '1.6.0';   // ⬅ suba a versão a cada atualização
document.getElementById('verBadge').textContent = 'v' + APP_VERSION;

const STATES = {
  prod: { label: 'Produzindo',            btn: 'Produção',  sub: 'contagem teórica ativa', color: 'var(--st-prod)', cls: 'prod' },
  stop: { label: 'Parada',                btn: 'Parada',    sub: 'informar motivo',        color: 'var(--st-stop)', cls: 'stop' },
  idle: { label: 'Ociosa — sem insumo',   btn: 'Ociosa',    sub: 'sem insumo',             color: 'var(--st-idle)', cls: 'idle' },
  wait: { label: 'Esperando linha',       btn: 'Esperando', sub: 'máquina da frente',      color: 'var(--st-wait)', cls: 'wait' },
};
const STATE_ORDER = ['prod', 'stop', 'idle', 'wait'];
/* classificação da parada — alimenta MTBF / MTBB / MTTA / MTTR */
const STOP_KINDS = {
  fail:  { label: 'Falha',       hint: 'sensor, alarme, travamento, erro de automação' },
  break: { label: 'Quebra',      hint: 'dano físico — exige reparo ou troca de peça' },
  op:    { label: 'Operacional', hint: 'setup, limpeza, falta de operador…' },
};
const DEFAULT_OEE_TARGET = 85; /* % */

/* ---------- persistência ---------- */
const KEY = 'mes_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.machines) {
      /* migração v1.1 → v1.2: motivos eram textos; agora têm descrição e planejada/não planejada */
      if (d.reasons && d.reasons.length && typeof d.reasons[0] === 'string') {
        d.reasons = d.reasons.map(n => ({ id: uid(), name: n, desc: '', planned: /setup|troca|limpeza/i.test(n) }));
      }
      return d;
    }
  } catch (e) {}
  return {
    machines: [],
    reasons: [
      { id: uid(), name: 'Manutenção corretiva', desc: 'Intervenção técnica não programada', planned: false },
      { id: uid(), name: 'Setup / Troca',        desc: 'Troca de produto, ferramenta ou lote', planned: true, stdMin: 10 },
      { id: uid(), name: 'Ajuste de processo',   desc: '', planned: false },
      { id: uid(), name: 'Falta de operador',    desc: '', planned: false },
      { id: uid(), name: 'Qualidade',            desc: 'Bloqueio ou inspeção de qualidade', planned: false },
      { id: uid(), name: 'Limpeza',              desc: 'Higienização programada', planned: true },
      { id: uid(), name: 'Outro',                desc: '', planned: false },
    ],
    sessions: [],
    active: null,
    theme: null,
    period: '7d',
    askDetail: true, /* pedir motivo ao marcar parada (false = parada simples, detalhar depois) */
  };
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
const reasonPlannedByName = n => { const r = db.reasons.find(x => x.name === n); return r ? !!r.planned : false; };

/* ---------- tema ---------- */
function applyTheme() {
  if (db.theme) document.documentElement.dataset.theme = db.theme;
  else delete document.documentElement.dataset.theme;
}
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  db.theme = dark ? 'light' : 'dark';
  save(); applyTheme();
};
applyTheme();

/* ---------- wake lock (tela sempre acesa) ---------- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeInd').classList.add('on');
      wakeLock.addEventListener('release', () => document.getElementById('wakeInd').classList.remove('on'));
    }
  } catch (e) { /* precisa de HTTPS + interação em alguns navegadores */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
window.addEventListener('click', () => { if (!wakeLock || wakeLock.released) keepAwake(); }, { once: false });
keepAwake();

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
               : `${m}:${String(ss).padStart(2,'0')}`;
}
function fmtDurLong(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  if (h > 0) return `${h}h ${m}min`;
  if (m > 0) return `${m}min`;
  return `${s}s`;
}
const fmtInt = n => Math.round(n).toLocaleString('pt-BR');
const pct = (x, dig=1) => (x * 100).toFixed(dig).replace('.', ',') + '%';

/* segmentos de uma sessão (ativa: fecha o atual em "now") */
function segsOf(sess, now) {
  const out = sess.segs.map(s => ({ ...s }));
  if (sess.current) out.push({ ...sess.current, end: now || Date.now() });
  return out;
}
function totals(sess, now) {
  const t = { prod: 0, stop: 0, idle: 0, wait: 0, total: 0 };
  for (const s of segsOf(sess, now)) {
    const d = Math.max(0, (s.end || now || Date.now()) - s.start);
    t[s.state] += d; t.total += d;
  }
  return t;
}
function theoOf(sess, machine, now) {
  return totals(sess, now).prod / 60000 * (machine ? machine.rate : 0);
}
const machineById = id => db.machines.find(m => m.id === id);

/* =====================================================
   TABS
   ===================================================== */
let tab = 'apontar';
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
    render();
  };
});
function showPage() {
  for (const p of ['apontar', 'manual', 'dash', 'maq'])
    $('#page-' + p).classList.toggle('visible', tab === p);
}

/* =====================================================
   APONTAR
   ===================================================== */
function renderApontar() {

  if (!a) {

      <h2>Iniciar apontamento</h2>
      <p class="hint" style="margin-bottom:12px">Escolha a máquina que você vai acompanhar. O cronômetro começa quando você tocar no primeiro estado.</p>
      <div class="machine-pick">${db.machines.map(m => `
        <button data-start="${m.id}">
          <span><span class="nm">${esc(m.name)}</span><br><span class="rt">${esc(m.sector || '')}</span></span>

        <div class="hint">${fmtInt(m ? m.rate : 0)} pçs/min nominal · início ${new Date(a.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <div style="text-align:right"><div class="hint">tempo total</div>
        <div style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums" id="tTotal">0:00</div></div>

        <span class="tm" id="tState">${cur ? '' : '—'}</span>
      </div>

      ${cur && cur.state === 'stop' && !cur.reason ? '<div style="height:10px"></div><button class="btn ghost" id="detailBtn">📝 Definir motivo da parada (opcional)</button>' : ''}

      ${cur && cur.state === 'stop' && cur.planned && cur.stdMs ? '<p class="hint" id="stdHint" style="margin-top:8px"></p>' : ''}
      ${cur && cur.state === 'stop' && cur.kind && cur.kind !== 'op' ? (
        cur.maintAt
          ? `<p class="hint" style="margin-top:8px">🔧 Manutenção chegou às ${new Date(cur.maintAt).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})} (atendimento em ${fmtDurLong(cur.maintAt - cur.start)}) — em reparo.</p>`
          : `<div style="height:10px"></div><button class="btn ghost" id="maintBtn">🔧 Manutenção chegou (marca o MTTA)</button>`
      ) : ''}

      <div style="height:12px"></div>
      <div class="state-grid">
        ${STATE_ORDER.map(k => `
          <button class="state-btn ${STATES[k].cls} ${cur && cur.state === k ? 'current' : ''}" data-state="${k}">
            ${STATES[k].btn}<small>${STATES[k].sub}</small>
          </button>`).join('')}
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="detailToggle" ${db.askDetail !== false ? 'checked' : ''}>
        <span>Pedir motivo ao marcar <b>Parada</b> — desligue para apontar só “parou” e detalhar depois</span>

      <h2>Produção</h2>

        <div class="kpi"><div class="k">Contagem teórica</div><div class="v" id="theoV">0 <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Ritmo nominal</div><div class="v">${fmtInt(m ? m.rate : 0)} <small>pçs/min</small></div></div>
      </div>
      <p class="hint" style="margin-top:10px">A contagem teórica sobe apenas enquanto o estado é <b>Produção</b>. Ao finalizar, informe a produção real e o refugo para ver a diferença.</p>

      <h2>Tempos acumulados</h2>

    <div style="display:grid;gap:10px">

      if (k === 'stop') { db.askDetail !== false ? openReasonSheet() : setState('stop'); }
      else setState(k);
    };
  });
  $('#detailToggle').onchange = e => { db.askDetail = e.target.checked; save(); };
  const db_ = $('#detailBtn'); if (db_) db_.onclick = () => openSegReasonSheet('cur');
  el.querySelectorAll('[data-editseg]').forEach(b => b.onclick = () => {

    openSegEditSheet(v === 'cur' ? 'cur' : +v);
  });

  $('#finishBtn').onclick = openFinishSheet;
  $('#cancelBtn').onclick = () => {
    openSheet(`<h3>Descartar apontamento?</h3>
      <p class="hint">Todos os tempos desta medição serão perdidos.</p>
      <button class="btn danger" id="cfDel">Sim, descartar</button>
      <button class="btn ghost" id="cfNo">Voltar</button>`);
    $('#cfDel').onclick = () => { db.active = null; save(); closeSheet(); render(); };

}

function startSession(machineId) {
  db.active = { id: uid(), machineId, start: Date.now(), segs: [], current: null };
  save(); render();
}

/* trocar de estado: fecha o segmento atual (qualquer categoria interrompe a produção) */
function setState(state, reason, kind, planned, stdMs) {
  const a = db.active; if (!a) return;
  const now = Date.now();
  if (a.current) {
    if (a.current.state === state && (a.current.reason || null) === (reason || null)) return;
    a.segs.push({ ...a.current, end: now });
  }
  a.current = { state, reason: reason || null, kind: kind || null,
    planned: planned === undefined ? null : !!planned,
    stdMs: stdMs > 0 ? stdMs : null, start: now };
  save(); render();
}

const plannedBadge = p => `<span class="badge ${p ? 'planned' : 'unplanned'}">${p ? 'planejada' : 'não planejada'}</span>`;

function openReasonSheet() {
  openSheet(`<h3>Motivo da parada</h3>
    ${db.reasons.map((r, i) => `<button class="opt" data-r="${i}">
      <b>${esc(r.name)}</b> ${plannedBadge(r.planned)}${r.planned && r.stdMin > 0 ? ` <span class="hint">padrão ${r.stdMin}min</span>` : ''}
      ${r.desc ? `<br><span class="hint">${esc(r.desc)}</span>` : ''}</button>`).join('')}
    <button class="btn ghost" id="rCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = db.reasons[+b.dataset.r];
    if (r.planned) { setState('stop', r.name, 'op', true, (r.stdMin || 0) * 60000); closeSheet(); } /* planejada não é falha/quebra */
    else openKindSheet(r);
  });
  $('#rCancel').onclick = closeSheet;
}

function openKindSheet(r) {
  openSheet(`<h3>Tipo da parada — ${esc(r.name)}</h3>
    <p class="hint">A classificação alimenta os indicadores MTBF, MTBB, MTTA e MTTR.</p>
    ${Object.entries(STOP_KINDS).map(([k, v]) =>
      `<button class="opt" data-k="${k}"><b>${v.label}</b><br><span class="hint">${v.hint}</span></button>`).join('')}
    <button class="btn ghost" id="kCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    setState('stop', r.name, b.dataset.k, r.planned); closeSheet();
  });
  $('#kCancel').onclick = closeSheet;
}

/* ---------- lista de marcações da medição (editável) ---------- */
function segLabel(seg) {
  let l = STATES[seg.state].label;
  if (seg.state === 'stop') l += seg.reason ? ' — ' + seg.reason : ' — sem motivo';
  if (seg.kind && seg.kind !== 'op') l += ' · ' + STOP_KINDS[seg.kind].label;
  return l;
}
const fmtHM = ms => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function renderSegList(a) {
  const row = (idx, seg, live) => `
    <div class="list-row">
      <span class="sw" style="background:${STATES[seg.state].color}"></span>
      <div class="info">
        <div class="nm" style="font-size:13.5px">${esc(segLabel(seg))}
          ${seg.state === 'stop' && seg.planned != null ? plannedBadge(seg.planned) : ''}
          ${live ? '<span style="color:var(--good);font-size:11px">● agora</span>' : ''}</div>
        <div class="sub">${fmtHM(seg.start)}–${live ? '…' : fmtHM(seg.end)} · <span ${live ? 'id="curSegDur"' : ''}>${fmtDur((live ? Date.now() : seg.end) - seg.start)}</span></div>
      </div>
      <div class="act"><button data-editseg="${idx}" aria-label="corrigir">✎</button></div>
    </div>`;
  const rows = [];
  if (a.current) rows.push(row('cur', a.current, true));
  for (let i = a.segs.length - 1; i >= 0; i--) rows.push(row(i, a.segs[i], false));
  return rows.join('');
}

/* alvo do editor de marcação: apontamento ativo (padrão) ou uma sessão fechada (sessId) */
function segTarget(idx, sessId) {
  if (sessId) { const s = db.sessions.find(x => x.id === sessId); return s ? s.segs[idx] : null; }
  const a = db.active; if (!a) return null;
  return idx === 'cur' ? a.current : a.segs[idx];
}

function applySegEdit(idx, patch, sessId) {
  const seg = segTarget(idx, sessId);
  if (!seg) return;
  Object.assign(seg, patch);
  if (seg.state !== 'stop') { seg.reason = null; seg.kind = null; seg.planned = null; seg.stdMs = null; delete seg.maintAt; }
  else if (!seg.kind || seg.kind === 'op') delete seg.maintAt;
  if (sessId) {
    /* sessão fechada: recalcula a teórica, pois o tempo produzindo pode ter mudado */
    const s = db.sessions.find(x => x.id === sessId);
    const m = machineById(s.machineId);
    s.theo = totals(s).prod / 60000 * (m ? m.rate : 0);
  }
  save();
  if (sessId) { render(); openSessionEditSheet(sessId); }
  else { closeSheet(); render(); }
}

function openSegEditSheet(idx, sessId) {
  const seg = segTarget(idx, sessId);
  if (!seg) return;
  openSheet(`<h3>Corrigir marcação</h3>
    <p class="hint">${esc(segLabel(seg))} · ${fmtHM(seg.start)}–${!sessId && idx === 'cur' ? 'agora' : fmtHM(seg.end)}</p>
    ${STATE_ORDER.map(k => `<button class="opt" data-k="${k}" ${k === seg.state ? 'style="outline:2px solid var(--accent)"' : ''}>
      <b>${STATES[k].label}</b>${k === 'stop' ? '<br><span class="hint">escolhe o motivo em seguida</span>' : ''}</button>`).join('')}
    <button class="btn ghost" id="seCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'stop') openSegReasonSheet(idx, sessId);
    else applySegEdit(idx, { state: k }, sessId);
  });
  $('#seCancel').onclick = () => sessId ? openSessionEditSheet(sessId) : closeSheet();
}

function openSegReasonSheet(idx, sessId) {
  openSheet(`<h3>Motivo da parada</h3>
    <button class="opt" data-r="none"><b>Sem motivo</b><br><span class="hint">definir depois</span></button>
    ${db.reasons.map((r, i) => `<button class="opt" data-r="${i}">
      <b>${esc(r.name)}</b> ${plannedBadge(r.planned)}${r.planned && r.stdMin > 0 ? ` <span class="hint">padrão ${r.stdMin}min</span>` : ''}
      ${r.desc ? `<br><span class="hint">${esc(r.desc)}</span>` : ''}</button>`).join('')}
    <button class="btn ghost" id="srCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    if (b.dataset.r === 'none') return applySegEdit(idx, { state: 'stop', reason: null, kind: null, planned: null, stdMs: null }, sessId);
    const r = db.reasons[+b.dataset.r];
    if (r.planned) applySegEdit(idx, { state: 'stop', reason: r.name, kind: 'op', planned: true, stdMs: (r.stdMin || 0) * 60000 }, sessId);
    else openSegKindSheet(idx, r, sessId);
  });
  $('#srCancel').onclick = () => sessId ? openSessionEditSheet(sessId) : closeSheet();
}

function openSegKindSheet(idx, r, sessId) {
  openSheet(`<h3>Tipo da parada — ${esc(r.name)}</h3>
    ${Object.entries(STOP_KINDS).map(([k, v]) =>
      `<button class="opt" data-k="${k}"><b>${v.label}</b><br><span class="hint">${v.hint}</span></button>`).join('')}
    <button class="btn ghost" id="skCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () =>
    applySegEdit(idx, { state: 'stop', reason: r.name, kind: b.dataset.k, planned: false, stdMs: null }, sessId));
  $('#skCancel').onclick = () => sessId ? openSessionEditSheet(sessId) : closeSheet();
}

/* ---------- editar / reabrir apontamento fechado ---------- */
function openSessionEditSheet(id) {
  const s = db.sessions.find(x => x.id === id); if (!s) return;
  const m = machineById(s.machineId);
  const t = totals(s);
  openSheet(`<h3>Editar apontamento — ${esc(m ? m.name : '?')}</h3>
    <p class="hint">${new Date(s.start).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}
      · ${fmtDurLong(t.total)} · teórica ${fmtInt(s.theo)} pçs${s.manual ? ' · ✎ manual' : ''}</p>
    <div class="kpi-row">
      <div class="field" style="margin:0"><label for="eReal">Produção real (pçs)</label>
        <input id="eReal" type="number" inputmode="numeric" min="0" value="${s.real}"></div>
      <div class="field" style="margin:0"><label for="eScrap">Refugo (pçs)</label>
        <input id="eScrap" type="number" inputmode="numeric" min="0" value="${s.scrap}"></div>
    </div>
    <button class="btn" id="eSave">Salvar produção / refugo</button>
    <h3 style="font-size:14px;margin-top:4px">Marcações — toque em ✎ para corrigir</h3>
    ${s.segs.map((seg, i) => `
      <div class="list-row">
        <span class="sw" style="background:${STATES[seg.state].color}"></span>
        <div class="info"><div class="nm" style="font-size:13px">${esc(segLabel(seg))}
          ${seg.state === 'stop' && seg.planned != null ? plannedBadge(seg.planned) : ''}</div>
          <div class="sub">${fmtHM(seg.start)}–${fmtHM(seg.end)} · ${fmtDur(seg.end - seg.start)}</div></div>
        <div class="act"><button data-editseg2="${i}">✎</button></div>
      </div>`).join('')}
    ${db.active
      ? '<p class="hint">Para reabrir este apontamento e voltar a medir, finalize ou descarte antes o apontamento em andamento.</p>'
      : '<button class="btn ghost" id="eReopen">🔓 Reabrir apontamento (voltar a medir)</button>'}
    <button class="btn ghost" id="eClose">Fechar</button>`);
  $('#eSave').onclick = () => {
    const real = Math.max(0, +$('#eReal').value || 0);
    s.real = real;
    s.scrap = Math.min(real, Math.max(0, +$('#eScrap').value || 0));
    save(); render(); openSessionEditSheet(id);
  };
  $('#sheet').querySelectorAll('[data-editseg2]').forEach(b => b.onclick = () => openSegEditSheet(+b.dataset.editseg2, id));
  const rb = $('#eReopen'); if (rb) rb.onclick = () => reopenSession(id);
  $('#eClose').onclick = closeSheet;
}

function reopenSession(id) {
  if (db.active) return; /* só sem apontamento em andamento */
  const i = db.sessions.findIndex(x => x.id === id); if (i < 0) return;
  const s = db.sessions.splice(i, 1)[0];
  /* volta a ser o apontamento ativo; o intervalo fechado→reaberto não conta em nenhum tempo
     (os tempos são somados só dos segmentos marcados) */
  db.active = { id: s.id, machineId: s.machineId, start: s.start, segs: s.segs, current: null,
    prevReal: s.real, prevScrap: s.scrap, manual: s.manual || undefined };
  save(); closeSheet();
  tab = 'apontar';
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'apontar'));
  render();
}

/* registrar chegada da manutenção na parada atual (MTTA / MTTR) */
function markMaintArrived() {
  const a = db.active;
  if (a && a.current && a.current.state === 'stop' && !a.current.maintAt) {
    a.current.maintAt = Date.now();
    save(); render();
  }
}

function openFinishSheet() {
  const a = db.active; if (!a) return;
  const m = machineById(a.machineId);
  const theo = theoOf(a, m);
  openSheet(`<h3>Finalizar apontamento — ${esc(m ? m.name : '')}</h3>
    <div class="kpi"><div class="k">Produção teórica (${fmtDurLong(totals(a).prod)} produzindo)</div>
      <div class="v">${fmtInt(theo)} <small>pçs</small></div></div>
    <div class="field"><label for="fReal">Produção real (peças contadas)</label>
      <input id="fReal" type="number" inputmode="numeric" min="0" placeholder="0" value="${a.prevReal != null ? a.prevReal : ''}"></div>
    <div class="field"><label for="fScrap">Refugo (peças ruins, dentro do total real)</label>
      <input id="fScrap" type="number" inputmode="numeric" min="0" value="${a.prevScrap != null ? a.prevScrap : 0}"></div>
    <div class="hint" id="fPreview"></div>
    <button class="btn" id="fSave">Salvar apontamento</button>
    <button class="btn ghost" id="fBack">Voltar</button>`);
  const upd = () => {
    const real = +$('#fReal').value || 0;
    const diff = real - theo;
    $('#fPreview').innerHTML = real > 0
      ? `Diferença real − teórica: <b class="${diff >= 0 ? 'diff-pos' : 'diff-neg'}">${diff >= 0 ? '+' : ''}${fmtInt(diff)} pçs (${pct(theo > 0 ? real / theo : 0)} do teórico)</b>`
      : '';
  };
  $('#fReal').oninput = upd;
  upd();
  $('#fBack').onclick = closeSheet;
  $('#fSave').onclick = () => {
    const real = Math.max(0, +$('#fReal').value || 0);
    const scrap = Math.min(real, Math.max(0, +$('#fScrap').value || 0));
    const now = Date.now();
    const segs = segsOf(a, now);
    db.sessions.push({
      id: a.id, machineId: a.machineId, start: a.start, end: now,
      segs, theo: theoOf(a, m, now), real, scrap,
      ...(a.manual ? { manual: true } : {}),
    });
    db.active = null; save(); closeSheet();
    tab = 'dash';
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'dash'));
    render();
  };
}

/* ---------- tick de 1s: cronômetros ao vivo ---------- */
setInterval(tick, 1000);
function tick() {
  const a = db.active;
  if (!a || tab !== 'apontar') return;
  const m = machineById(a.machineId);
  const t = totals(a);
  const elT = $('#tTotal'); if (elT) elT.textContent = fmtDur(t.total);
  const elS = $('#tState');
  if (elS && a.current) elS.textContent = fmtDur(Date.now() - a.current.start);
  const csd = $('#curSegDur');
  if (csd && a.current) csd.textContent = fmtDur(Date.now() - a.current.start);
  const sh = $('#stdHint');
  if (sh && a.current && a.current.stdMs) {
    const rem = a.current.stdMs - (Date.now() - a.current.start);
    sh.innerHTML = rem >= 0
      ? `⏱ Tempo padrão ${fmtDurLong(a.current.stdMs)} — resta <b>${fmtDur(rem)}</b> dentro do planejado`
      : `⚠️ <b style="color:var(--bad)">Estourou o tempo padrão em ${fmtDur(-rem)}</b> — o excedente conta como não planejado`;
  }
  const elTh = $('#theoV'); if (elTh) elTh.innerHTML = fmtInt(theoOf(a, m)) + ' <small>pçs</small>';
  const list = $('#timeList');
  if (list) list.innerHTML = STATE_ORDER.map(k => `
    <div class="time-row"><span class="sw" style="background:${STATES[k].color}"></span>
      <span class="nm">${STATES[k].label}</span><span class="tv">${fmtDur(t[k])}</span></div>`).join('') +
    `<div class="time-row" style="border-top:1px solid var(--grid);padding-top:8px">
      <span class="sw" style="background:transparent"></span><span class="nm"><b>Total</b></span><span class="tv">${fmtDur(t.total)}</span></div>`;
}

/* =====================================================
   MANUAL — OEE a partir de dados digitados
   ===================================================== */
function renderManual() {
  const el = $('#page-manual');
  const m = db.manual || {};
  el.innerHTML = `
    <div class="card">
      <h2>Cálculo manual de OEE</h2>
      <p class="hint" style="margin-bottom:12px">Digite os dados do período (sem cronômetro) e veja o OEE na hora. Ex.: em 60min você parou 10min, fez 400 pçs e 50 eram refugo.</p>
      <div class="field"><label for="inMach">Máquina (para usar a capacidade cadastrada e poder salvar)</label>
        <select id="inMach"><option value="">— sem máquina —</option>
          ${db.machines.map(x => `<option value="${x.id}" ${m.machineId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label for="inRate">Capacidade nominal (peças por minuto)</label>
        <input id="inRate" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Ex.: 10" value="${m.rate ?? ''}"></div>
      <div class="kpi-row" style="margin-bottom:12px">
        <div class="field" style="margin:0"><label for="inTotal">Tempo total (min)</label>
          <input id="inTotal" type="number" inputmode="decimal" min="1" step="any" placeholder="Ex.: 60" value="${m.total ?? ''}"></div>
        <div class="field" style="margin:0"><label for="inStop">Paradas (min)</label>
          <input id="inStop" type="number" inputmode="decimal" min="0" step="any" placeholder="Ex.: 10" value="${m.stop ?? ''}"></div>
      </div>
      <div class="kpi-row" style="margin-bottom:12px">
        <div class="field" style="margin:0"><label for="inIdle">Ocioso — sem insumo (min)</label>
          <input id="inIdle" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${m.idle ?? ''}"></div>
        <div class="field" style="margin:0"><label for="inWait">Esperando linha (min)</label>
          <input id="inWait" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${m.wait ?? ''}"></div>
      </div>
      <div class="kpi-row">
        <div class="field" style="margin:0"><label for="inReal">Produção entregue (pçs)</label>
          <input id="inReal" type="number" inputmode="numeric" min="0" placeholder="Ex.: 400" value="${m.real ?? ''}"></div>
        <div class="field" style="margin:0"><label for="inScrap">Refugo (pçs)</label>
          <input id="inScrap" type="number" inputmode="numeric" min="0" placeholder="Ex.: 50" value="${m.scrap ?? ''}"></div>
      </div>
    </div>
    <div id="manualOut"></div>`;

  const ids = ['inRate', 'inTotal', 'inStop', 'inIdle', 'inWait', 'inReal', 'inScrap'];
  const readInputs = () => ({
    machineId: $('#inMach').value || null,
    rate: parseFloat($('#inRate').value),
    total: parseFloat($('#inTotal').value),
    stop: parseFloat($('#inStop').value) || 0,
    idle: parseFloat($('#inIdle').value) || 0,
    wait: parseFloat($('#inWait').value) || 0,
    real: parseFloat($('#inReal').value),
    scrap: parseFloat($('#inScrap').value) || 0,
  });
  const recalc = () => {
    db.manual = readInputs(); save();
    calcManual(db.manual);
  };
  ids.forEach(id => $('#' + id).oninput = recalc);
  $('#inMach').onchange = () => {
    const mm = machineById($('#inMach').value);
    if (mm) $('#inRate').value = mm.rate;
    recalc();
  };
  recalc();
}

function calcManual(v) {
  const out = $('#manualOut'); if (!out) return;
  const valid = v.rate > 0 && v.total > 0 && v.real >= 0 && !isNaN(v.real);
  if (!valid) { out.innerHTML = '<div class="card"><p class="hint">Preencha capacidade, tempo total e produção entregue para calcular.</p></div>'; return; }
  const down = v.stop + v.idle + v.wait;
  if (down > v.total) { out.innerHTML = '<div class="card"><p class="hint">⚠️ Paradas + ocioso + espera não podem passar do tempo total.</p></div>'; return; }
  const scrap = Math.min(v.scrap || 0, v.real);
  const oper = v.total - down;              /* tempo operando */
  const theo = v.rate * oper;               /* teórica no tempo operando */
  const A = oper / v.total;
  const P = theo > 0 ? v.real / theo : 0;
  const Q = v.real > 0 ? (v.real - scrap) / v.real : 0;
  const oee = A * P * Q;
  const lostPcs = theo - v.real;            /* peças que faltaram */
  const lostMin = lostPcs / v.rate;         /* tempo equivalente perdido */
  const effMin = Math.min(oper, v.real / v.rate); /* tempo efetivo de produção */

  const mm2 = machineById(v.machineId);
  const target = mm2 ? targetOf(mm2) : DEFAULT_OEE_TARGET;
  const okMeta = oee * 100 >= target;

  /* barra: para onde foi o tempo */
  const segsBar = [
    ['Produção efetiva', effMin, 'var(--st-prod)'],
    ['Microparadas / espera / ritmo (não apontado)', Math.max(0, lostMin), '#eb6834'],
    ['Paradas', v.stop, 'var(--st-stop)'],
    ['Ocioso', v.idle, 'var(--st-idle)'],
    ['Esperando', v.wait, 'var(--st-wait)'],
  ].filter(s => s[1] > 0.001);

  out.innerHTML = `
    <div class="card">
      <h2>Resultado</h2>
      <div class="gauge-grid">
        <div class="gauge gauge-hero">${donutSVG(oee, 'OEE', 'OEE', okMeta ? 'var(--good)' : 'var(--bad)')}
          <span class="glabel">OEE</span>
          <span class="gmeta">meta ${target.toFixed(0)}% · ${okMeta ? '✓ atingida' : 'abaixo'}</span></div>
        <div class="gauge">${donutSVG(A, 'Disponibilidade')}<span class="glabel">Disponibilidade</span></div>
        <div class="gauge">${donutSVG(P, 'Performance')}<span class="glabel">Performance</span></div>
        <div class="gauge">${donutSVG(Q, 'Qualidade')}<span class="glabel">Qualidade</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Para onde foi o tempo (${fmtInt(v.total)}min)</h2>
      <div class="stackbar">${segsBar.map(s => `<div style="flex:${s[1]};background:${s[2]}" title="${s[0]}"></div>`).join('')}</div>
      <div style="height:12px"></div>
      <div class="time-list">
        ${segsBar.map(s => `<div class="time-row"><span class="sw" style="background:${s[2]}"></span>
          <span class="nm">${s[0]}</span><span class="tv">${s[1].toFixed(1).replace('.', ',')}min</span></div>`).join('')}
      </div>
      <p class="hint" style="margin-top:12px">
        Operando ${fmtInt(oper)}min × ${v.rate} pçs/min = <b>${fmtInt(theo)} pçs teóricas</b>. Você entregou <b>${fmtInt(v.real)}</b>${scrap ? ` (${fmtInt(scrap)} de refugo)` : ''} —
        ${lostPcs > 0.5
          ? `faltaram <b>${fmtInt(lostPcs)} pçs</b>, o equivalente a <b class="diff-neg">${lostMin.toFixed(1).replace('.', ',')}min</b> de microparadas, espera, ociosidade ou ritmo reduzido que não foram apontados.`
          : lostPcs < -0.5
            ? `<b class="diff-pos">${fmtInt(-lostPcs)} pçs acima do teórico</b> — confira a capacidade nominal.`
            : 'em linha com o teórico. 🎯'}
      </p>
    </div>
    <div class="card">
      <h2>Salvar</h2>
      ${v.machineId
        ? '<button class="btn" id="manualSave">💾 Salvar como apontamento no Dashboard</button><p class="hint" style="margin-top:8px">Entra no período atual com os tempos e a produção informados (a perda de performance permanece como performance).</p>'
        : '<p class="hint">Escolha uma máquina acima para poder salvar este cálculo como apontamento.</p>'}
    </div>`;

  const sv = $('#manualSave');
  if (sv) sv.onclick = () => {
    const now = Date.now();
    const min = 60000;
    const start = now - v.total * min;
    const segs = [];
    let t = start;
    const push = (state, dur) => { if (dur > 0) { segs.push({ state, reason: null, kind: null, planned: null, start: t, end: t + dur * min }); t += dur * min; } };
    push('prod', oper); push('stop', v.stop); push('idle', v.idle); push('wait', v.wait);
    db.sessions.push({ id: uid(), machineId: v.machineId, start, end: now, segs, theo, real: v.real, scrap, manual: true });
    save();
    tab = 'dash';
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'dash'));
    render();
  };
}

/* =====================================================
   DASHBOARD
   ===================================================== */
const PERIODS = { hoje: ['Hoje', 0], '7d': ['7 dias', 7], '30d': ['30 dias', 30], tudo: ['Tudo', null] };

function periodStart(key) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const days = PERIODS[key][1];
  if (days === null) return 0;
  if (days === 0) return d.getTime();
  return d.getTime() - (days - 1) * 86400000;
}

function donutSVG(value, label, sub, color) {
  const r = 42, c = 2 * Math.PI * r;
  const v = Math.max(0, Math.min(1, value || 0));
  const shown = value == null ? '—' : (value * 100).toFixed(value >= 1 ? 0 : 1).replace('.', ',') + '%';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(label)}: ${shown}">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color || 'var(--accent)'}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${(v * c).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 50 50)"/>
    <text x="50" y="${sub ? 47 : 50}" text-anchor="middle" dominant-baseline="middle"
      font-size="${shown.length > 5 ? 17 : 20}" font-weight="800" fill="var(--ink)">${shown}</text>
    ${sub ? `<text x="50" y="64" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">${esc(sub)}</text>` : ''}
  </svg>`;
}
/* cor do gauge de OEE conforme a meta: verde ≥ meta, vermelho < meta */
function oeeColor(oee, targetPct) {
  if (oee == null || targetPct == null) return null;
  return oee * 100 >= targetPct ? 'var(--good)' : 'var(--bad)';
}
const targetOf = m => (m && m.oeeTarget > 0 ? m.oeeTarget : DEFAULT_OEE_TARGET);

function aggregate(sessions) {
  const agg = { t: { prod: 0, stop: 0, idle: 0, wait: 0, total: 0 }, theo: 0, real: 0, scrap: 0,
    reasons: {}, nFinished: 0,
    stopPlanned: 0, stopUnplanned: 0, stopExcess: 0,
    nStopPlanned: 0, nStopUnplanned: 0, nStopExcess: 0 };
  for (const s of sessions) {
    const t = totals(s);
    for (const k of ['prod','stop','idle','wait','total']) agg.t[k] += t[k];
    agg.theo += s.theo || theoOf(s, machineById(s.machineId));
    if (s.end !== undefined && s.real !== undefined) { agg.real += s.real; agg.scrap += s.scrap || 0; agg.nFinished++; }
    for (const seg of segsOf(s)) {
      if (seg.state === 'stop') {
        const r = seg.reason || 'Sem motivo';
        const dur = (seg.end || Date.now()) - seg.start;
        const planned = seg.planned != null ? seg.planned : reasonPlannedByName(seg.reason);
        const e = agg.reasons[r] || (agg.reasons[r] = { ms: 0, n: 0, plannedMs: 0, excessMs: 0 });
        e.ms += dur; e.n++;
        if (planned) {
          /* tempo padrão: o que passar dele conta como não planejado (variação operacional) */
          const std = seg.stdMs > 0 ? seg.stdMs : null;
          const pMs = std != null ? Math.min(dur, std) : dur;
          const xMs = dur - pMs;
          e.plannedMs += pMs; e.excessMs += xMs;
          agg.stopPlanned += pMs; agg.stopExcess += xMs; agg.nStopPlanned++;
          if (xMs > 0) agg.nStopExcess++;
        } else { agg.stopUnplanned += dur; agg.nStopUnplanned++; }
      }
    }
  }
  return agg;
}
/* MTBF / MTBB / MTTA / MTTR — sobre paradas classificadas como falha ou quebra */
function maintStats(sessions) {
  let opTime = 0, nFail = 0, nBreak = 0;
  const ttaList = [], ttrList = [];
  for (const s of sessions) {
    opTime += totals(s).prod;
    for (const seg of segsOf(s)) {
      if (seg.state !== 'stop' || !seg.kind || seg.kind === 'op') continue;
      const end = seg.end || Date.now();
      nFail++;                              // MTBF: toda falha (inclui quebras)
      if (seg.kind === 'break') nBreak++;   // MTBB: só quebras físicas
      if (seg.maintAt) {
        ttaList.push(seg.maintAt - seg.start);
        ttrList.push(end - seg.maintAt);
      } else {
        ttrList.push(end - seg.start);      // sem registro de chegada: reparo = parada inteira
      }
    }
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {
    nFail, nBreak,
    mtbf: nFail > 0 ? opTime / nFail : null,
    mtbb: nBreak > 0 ? opTime / nBreak : null,
    mtta: avg(ttaList),
    mttr: avg(ttrList),
  };
}

function oeeOf(agg) {
  const A = agg.t.total > 0 ? agg.t.prod / agg.t.total : null;
  const P = agg.nFinished > 0 && agg.theo > 0 ? agg.real / agg.theo : null;
  const Q = agg.nFinished > 0 && agg.real > 0 ? (agg.real - agg.scrap) / agg.real : null;
  const oee = (A !== null && P !== null && Q !== null) ? A * P * Q : null;
  return { A, P, Q, oee };
}

function renderDash() {
  const el = $('#page-dash');
  const from = periodStart(db.period);
  const done = db.sessions.filter(s => s.end >= from);
  const all = db.active ? [...done, db.active] : done;

  const chips = `<div class="chips">${Object.keys(PERIODS).map(k =>
    `<button class="${db.period === k ? 'active' : ''}" data-p="${k}">${PERIODS[k][0]}</button>`).join('')}</div>`;

  if (all.length === 0) {
    el.innerHTML = chips + `<div class="card"><div class="empty"><div class="big">◔</div>
      Sem apontamentos no período.<br>Faça uma medição na aba <b>Apontar</b>.</div></div>`;
    bindChips(el); return;
  }

  const agg = aggregate(all);
  const { A, P, Q, oee } = oeeOf(agg);

  /* barra empilhada de tempos */
  const tt = agg.t.total || 1;
  const stack = STATE_ORDER.map(k =>
    `<div style="flex:${Math.max(agg.t[k] / tt, 0)};background:${STATES[k].color}" title="${STATES[k].label}: ${fmtDurLong(agg.t[k])}"></div>`).join('');
  const legend = STATE_ORDER.map(k => `
    <div class="time-row"><span class="sw" style="background:${STATES[k].color}"></span>
      <span class="nm">${STATES[k].label}</span>
      <span class="tv">${fmtDurLong(agg.t[k])} · ${pct(agg.t[k] / tt, 0)}</span></div>`).join('');

  /* paradas por motivo (barras ordenadas, % acumulado como rótulo) */
  const reasons = Object.entries(agg.reasons).sort((a, b) => b[1].ms - a[1].ms);
  const stopTotal = reasons.reduce((s, r) => s + r[1].ms, 0) || 1;
  let cum = 0;
  const bars = reasons.map(([r, e]) => {
    cum += e.ms;
    const planned = e.plannedMs + e.excessMs >= e.ms / 2;
    /* barra bicolor quando a parada planejada estourou o tempo padrão */
    const pFrac = e.ms > 0 ? (e.plannedMs / e.ms * 100).toFixed(1) : 0;
    const fillBg = planned
      ? (e.excessMs > 0 ? `background:linear-gradient(90deg, var(--accent) ${pFrac}%, var(--bad) ${pFrac}%)` : 'background:var(--accent)')
      : '';
    return `<div class="hbar">
      <div class="top"><span class="n">${esc(r)} ${plannedBadge(planned)}</span>
        <span class="v">${fmtDurLong(e.ms)} · ${pct(e.ms / stopTotal, 0)} <span style="color:var(--muted)">(acum. ${pct(cum / stopTotal, 0)})</span></span></div>
      <div class="track"><div class="fill" style="width:${(e.ms / reasons[0][1].ms * 100).toFixed(1)}%;${fillBg}"></div></div>
      ${e.excessMs > 0 ? `<div class="top" style="margin-top:2px"><span class="n" style="font-size:11px">└ estouro do tempo padrão</span><span class="v" style="font-size:11px;color:var(--bad)">+${fmtDurLong(e.excessMs)}</span></div>` : ''}
    </div>`;
  }).join('');
  const unplannedTotal = agg.stopUnplanned + agg.stopExcess;
  const plannedSplit = agg.t.stop > 0 ? `
    <div class="kpi-row" style="margin-bottom:12px">
      <div class="kpi"><div class="k">Não planejadas</div><div class="v" style="color:var(--bad)">${fmtDurLong(unplannedTotal)}</div><div class="k">${agg.nStopUnplanned} evento(s)${agg.stopExcess > 0 ? ' + estouros' : ''}</div></div>
      <div class="kpi"><div class="k">Planejadas (no padrão)</div><div class="v" style="color:var(--accent)">${fmtDurLong(agg.stopPlanned)}</div><div class="k">${agg.nStopPlanned} evento(s)</div></div>
    </div>
    ${agg.stopExcess > 0 ? `<p class="hint" style="margin-bottom:12px">⚠️ <b>${fmtDurLong(agg.stopExcess)}</b> de estouro sobre o tempo padrão em ${agg.nStopExcess} parada(s) planejada(s) — variação operacional, contabilizada como não planejada.</p>` : ''}` : '';

  /* por máquina */
  const machines = db.machines.filter(m => all.some(s => s.machineId === m.id));
  const perMachine = machines.map(m => {
    const ms = all.filter(s => s.machineId === m.id);
    const ag = aggregate(ms);
    const o = oeeOf(ag);
    const live = db.active && db.active.machineId === m.id;
    return `<div class="mrow">
      ${donutSVG(o.oee !== null ? o.oee : o.A, 'OEE ' + m.name, o.oee !== null ? 'OEE' : 'DISP',
        o.oee !== null ? oeeColor(o.oee, targetOf(m)) : null)}
      <div class="info">
        <div class="nm">${esc(m.name)}${live ? ' <span style="color:var(--good);font-size:11px">● ao vivo</span>' : ''}</div>
        <div class="sub">${esc(m.sector || '')} · meta OEE ${targetOf(m)}% · ${fmtInt(ag.real)} pçs reais · ${fmtInt(ag.scrap)} refugo</div>
        <div class="mini">
          <span>Produzindo <b>${fmtDurLong(ag.t.prod)}</b></span><span>Parada <b>${fmtDurLong(ag.t.stop)}</b></span>
          <span>Ociosa <b>${fmtDurLong(ag.t.idle)}</b></span><span>Esperando <b>${fmtDurLong(ag.t.wait)}</b></span>
        </div>
      </div></div>`;
  }).join('');

  const prodCard = agg.nFinished > 0 ? `
    <div class="card"><h2>Produção do período</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="k">Teórica</div><div class="v">${fmtInt(agg.theo)} <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Real</div><div class="v">${fmtInt(agg.real)} <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Diferença</div><div class="v ${agg.real - agg.theo >= 0 ? 'diff-pos' : 'diff-neg'}">${agg.real - agg.theo >= 0 ? '+' : ''}${fmtInt(agg.real - agg.theo)}</div></div>
        <div class="kpi"><div class="k">Refugo</div><div class="v">${fmtInt(agg.scrap)} <small>pçs</small></div></div>
      </div></div>` : '';

  /* meta de OEE do período: média das metas das máquinas com dados */
  const targets = machines.map(targetOf);
  const target = targets.length ? targets.reduce((a, b) => a + b, 0) / targets.length : DEFAULT_OEE_TARGET;

  /* indicadores de manutenção */
  const ms = maintStats(all);
  const fmtM = v => v === null ? '—' : fmtDurLong(v);
  const maintCard = `
    <div class="card"><h2>Manutenção</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="k">MTBF · entre falhas <span class="diff-pos">↑</span></div>
          <div class="v">${fmtM(ms.mtbf)}</div><div class="k">${ms.nFail} falha(s)</div></div>
        <div class="kpi"><div class="k">MTBB · entre quebras <span class="diff-pos">↑</span></div>
          <div class="v">${fmtM(ms.mtbb)}</div><div class="k">${ms.nBreak} quebra(s)</div></div>
        <div class="kpi"><div class="k">MTTA · atendimento <span class="diff-neg">↓</span></div>
          <div class="v">${fmtM(ms.mtta)}</div><div class="k">chamado → chegada</div></div>
        <div class="kpi"><div class="k">MTTR · reparo <span class="diff-neg">↓</span></div>
          <div class="v">${fmtM(ms.mttr)}</div><div class="k">chegada → liberação</div></div>
      </div>
      <p class="hint" style="margin-top:10px">Classifique a parada como <b>Falha</b> ou <b>Quebra</b> e toque em “Manutenção chegou” durante a parada para alimentar MTTA e MTTR. Tempo operacional = tempo produzindo.</p>
    </div>`;

  el.innerHTML = chips + `
    <button class="btn ghost" id="repBtn">📄 Relatório executivo — salvar PNG / PDF</button>
    <div class="card">
      <h2>Visão geral · ${PERIODS[db.period][0].toLowerCase()}</h2>
      <div class="gauge-grid">
        <div class="gauge gauge-hero">${donutSVG(oee, 'OEE', 'OEE', oeeColor(oee, target))}
          <span class="glabel">OEE ${oee === null ? '(finalize um apontamento p/ calcular)' : ''}</span>
          <span class="gmeta">meta ${target.toFixed(0)}%${oee !== null ? (oee * 100 >= target ? ' · ✓ atingida' : ' · abaixo') : ''}</span></div>
        <div class="gauge">${donutSVG(A, 'Disponibilidade')}<span class="glabel">Disponibilidade</span></div>
        <div class="gauge">${donutSVG(P, 'Performance')}<span class="glabel">Performance</span></div>
        <div class="gauge">${donutSVG(Q, 'Qualidade')}<span class="glabel">Qualidade</span></div>
      </div>
    </div>
    ${prodCard}
    ${maintCard}
    <div class="card">
      <h2>Distribuição do tempo</h2>
      <div class="stackbar">${stack}</div>
      <div style="height:12px"></div>
      <div class="time-list">${legend}
        <div class="time-row" style="border-top:1px solid var(--grid);padding-top:8px">
          <span class="sw" style="background:transparent"></span><span class="nm"><b>Total medido</b></span><span class="tv">${fmtDurLong(agg.t.total)}</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Paradas — principais motivos</h2>
      ${plannedSplit}
      ${reasons.length ? `<div class="hbars">${bars}</div>` : '<p class="hint">Nenhuma parada apontada no período. 🎉</p>'}
    </div>
    <div class="card">
      <h2>Por máquina</h2>
      ${perMachine || '<p class="hint">Sem dados por máquina.</p>'}
    </div>
    <div class="card">
      <h2>Apontamentos (${done.length})</h2>
      ${done.slice().reverse().slice(0, 20).map(s => {
        const m = machineById(s.machineId); const t = totals(s);
        return `<div class="list-row"><div class="info">
          <div class="nm">${esc(m ? m.name : '?')} — ${fmtInt(s.real)} pçs <span style="color:var(--muted);font-weight:400">(teo ${fmtInt(s.theo)})</span></div>
          <div class="sub">${new Date(s.start).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${fmtDurLong(t.total)} · refugo ${fmtInt(s.scrap)}${s.manual ? ' · ✎ manual' : ''}</div>
        </div><div class="act"><button data-edit-sess="${s.id}">✎</button><button data-del-sess="${s.id}" style="color:var(--bad)">✕</button></div></div>`;
      }).join('') || '<p class="hint">Nenhum apontamento finalizado.</p>'}
      <p class="hint" style="margin-top:8px">Toque em ✎ para editar um apontamento fechado — corrigir marcações, produção e refugo, ou reabri-lo para voltar a medir.</p>
    </div>`;

  bindChips(el);
  $('#repBtn').onclick = openReport;
  el.querySelectorAll('[data-edit-sess]').forEach(b => b.onclick = () => openSessionEditSheet(b.dataset.editSess));
  el.querySelectorAll('[data-del-sess]').forEach(b => b.onclick = () => {
    openSheet(`<h3>Excluir este apontamento?</h3>
      <button class="btn danger" id="dsY">Sim, excluir</button><button class="btn ghost" id="dsN">Voltar</button>`);
    $('#dsY').onclick = () => { db.sessions = db.sessions.filter(s => s.id !== b.dataset.delSess); save(); closeSheet(); render(); };
    $('#dsN').onclick = closeSheet;
  });
}
function bindChips(el) {
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { db.period = b.dataset.p; save(); render(); });
}

    <div class="card">
      <h2>${editing ? 'Editar máquina' : 'Cadastrar máquina'}</h2>
      <div class="field"><label for="mNome">Nome da máquina</label>
        <input id="mNome" placeholder="Ex.: Extrusora 01" value="${editing ? esc(editing.name) : ''}"></div>
      <div class="field"><label for="mSetor">Setor / grupo (opcional)</label>
        <input id="mSetor" placeholder="Ex.: Extrusão" value="${editing ? esc(editing.sector || '') : ''}"></div>
      <div class="field"><label for="mTaxa">Capacidade nominal (peças por minuto)</label>
        <input id="mTaxa" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Ex.: 100" value="${editing ? editing.rate : ''}"></div>
      <div class="field"><label for="mMeta">Meta de OEE (%)</label>
        <input id="mMeta" type="number" inputmode="decimal" min="1" max="100" step="any" placeholder="Ex.: ${DEFAULT_OEE_TARGET}" value="${editing && editing.oeeTarget ? editing.oeeTarget : ''}"></div>
      <button class="btn" id="mSave">${editing ? 'Salvar alterações' : '+ Cadastrar máquina'}</button>
      ${editing ? '<div style="height:8px"></div><button class="btn ghost" id="mCancelEdit">Cancelar edição</button>' : ''}
    </div>

    <div class="card">
      <h2>Máquinas cadastradas (${db.machines.length})</h2>
      ${db.machines.map(m => `
        <div class="list-row">
          <div class="info"><div class="nm">${esc(m.name)}</div>
            <div class="sub">${esc(m.sector || 'sem setor')} · ${fmtInt(m.rate)} pçs/min · meta OEE ${targetOf(m)}%</div></div>
          <div class="act">
            <button data-edit="${m.id}">✎</button>
            <button data-del="${m.id}" style="color:var(--bad)">✕</button>
          </div>
        </div>`).join('') || '<p class="hint">Nenhuma máquina ainda.</p>'}
    </div>

    <div class="card">
      <h2>Motivos de parada</h2>
      <p class="hint" style="margin-bottom:6px">Tipo, descrição e classificação (planejada ou não planejada) de cada motivo. Paradas planejadas não contam como falha/quebra.</p>
      ${db.reasons.map((r, i) => `
        <div class="list-row">
          <div class="info"><div class="nm">${esc(r.name)} ${plannedBadge(r.planned)}</div>
            <div class="sub">${esc(r.desc || 'sem descrição')}${r.planned && r.stdMin > 0 ? ` · tempo padrão ${r.stdMin}min` : ''}</div></div>
          <div class="act"><button data-editr="${i}">✎</button><button data-delr="${i}" style="color:var(--bad)">✕</button></div>
        </div>`).join('')}
      <div style="height:12px"></div>
      <button class="btn ghost" id="rAdd">+ Novo motivo de parada</button>
    </div>

    <div class="card">
      <h2>Sobre</h2>
      <p class="hint">MES de apontamento manual — versão <b>v${APP_VERSION}</b>. Os dados ficam salvos neste aparelho (localStorage). A tela permanece acesa enquanto o app estiver aberto (indicador “tela” no topo).</p>
    </div>`;

  $('#mSave').onclick = () => {
    const name = $('#mNome').value.trim();
    const rate = parseFloat($('#mTaxa').value);
    let meta = parseFloat($('#mMeta').value);
    if (!name) { $('#mNome').focus(); return; }
    if (!(rate > 0)) { $('#mTaxa').focus(); return; }
    if (!(meta > 0 && meta <= 100)) meta = DEFAULT_OEE_TARGET;
    if (editing) { editing.name = name; editing.sector = $('#mSetor').value.trim(); editing.rate = rate; editing.oeeTarget = meta; editingId = null; }
    else db.machines.push({ id: uid(), name, sector: $('#mSetor').value.trim(), rate, oeeTarget: meta });
    save(); render();
  };
  if (editing) $('#mCancelEdit').onclick = () => { editingId = null; render(); };
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editingId = b.dataset.edit; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const m = machineById(b.dataset.del);
    openSheet(`<h3>Excluir “${esc(m.name)}”?</h3>
      <p class="hint">Os apontamentos já feitos desta máquina continuam no histórico.</p>
      <button class="btn danger" id="dmY">Sim, excluir</button><button class="btn ghost" id="dmN">Voltar</button>`);
    $('#dmY').onclick = () => {
