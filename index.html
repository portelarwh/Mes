<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>MES — Apontamento de Produção</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MES">
<style>
  /* ============ Tokens (claro / escuro) ============ */
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --ring:      rgba(11,11,11,.10);
    --accent:    #2a78d6;   /* azul — produção / métricas */
    --accent-soft: #cde2fb;
    --st-prod:   #2a78d6;   /* produzindo */
    --st-stop:   #e34948;   /* parada */
    --st-idle:   #4a3aa7;   /* ociosa (sem insumo) */
    --st-wait:   #eda100;   /* esperando linha à frente */
    --good:      #006300;
    --bad:       #d03b3b;
    --track:     #eceae4;
    --btn-ink:   #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --ring:      rgba(255,255,255,.10);
    --accent:    #3987e5;
    --accent-soft: #16324f;
    --st-prod:   #3987e5;
    --st-stop:   #e66767;
    --st-idle:   #9085e9;
    --st-wait:   #c98500;
    --good:      #0ca30c;
    --bad:       #e66767;
    --track:     #2c2c2a;
    --btn-ink:   #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --accent:#3987e5; --accent-soft:#16324f;
      --st-prod:#3987e5; --st-stop:#e66767; --st-idle:#9085e9; --st-wait:#c98500;
      --good:#0ca30c; --bad:#e66767; --track:#2c2c2a; --btn-ink:#fff;
    }
  }

  /* ============ Splash ============ */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    display: grid; align-content: center; justify-items: center; gap: 2px;
    background: var(--page); color: var(--ink);
    transition: opacity .35s ease;
  }
  #splash img {
    width: 128px; height: 128px; border-radius: 28px; margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
  }
  #splash .nm { font-size: 26px; font-weight: 800; letter-spacing: .04em; }
  #splash .sub { font-size: 13px; color: var(--muted); }
  #splash .vr {
    margin-top: 14px; font-size: 11px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px;
    font-variant-numeric: tabular-nums; min-height: 22px;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); }

  /* ============ Header ============ */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: var(--page); border-bottom: 1px solid var(--grid);
  }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  .ver {
    font-size: 11px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--ring); border-radius: 999px; padding: 3px 8px;
    font-variant-numeric: tabular-nums; cursor: pointer; flex: none;
  }
  .ver:active { background: var(--accent-soft); }

  /* banner de atualização — só aparece quando há modal aberto na hora */
  .upd-banner {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 60;
    display: flex; align-items: center; gap: 12px; max-width: 92vw;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 999px; padding: 8px 8px 8px 16px; font-size: 13px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28);
  }
  .upd-banner .pick { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
  .upd-banner .pick.ghost-x { background: none; border-color: var(--baseline); color: var(--muted); padding: 8px 11px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--ring);
    display: grid; place-items: center; font-size: 16px; background: var(--surface);
  }
  .wake { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .wake .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .wake.on .dot { background: var(--good); }
  #cloudInd { flex: none; max-width: 96px; cursor: pointer; }
  #cloudInd .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ============ Layout ============ */
  main { padding: 14px; display: grid; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 16px; padding: 16px;
  }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  /* ============ Tabs ============ */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    max-width: 560px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--grid);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button { padding: 10px 4px 8px; display: grid; gap: 2px; justify-items: center; color: var(--muted); font-size: 11px; font-weight: 600; }
  nav button .ico { font-size: 19px; }
  nav button.active { color: var(--accent); }
  .page { display: none; }
  .page.visible { display: grid; gap: 14px; }

  /* ============ Apontar ============ */
  .machine-pick { display: grid; gap: 8px; }
  .machine-pick button {
    text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--ring);
    background: var(--page); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .machine-pick .nm { font-weight: 700; font-size: 15px; }
  .machine-pick .rt { font-size: 12px; color: var(--muted); }

  .now-state {
    border-radius: 14px; padding: 14px 16px; color: var(--btn-ink);
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .now-state .lbl { font-size: 14px; font-weight: 700; }
  .now-state .tm { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .now-state.none { background: var(--track); color: var(--ink-2); }

  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 899px) {
    div[style*="grid-auto-flow:column"] { grid-auto-flow: row !important; }
  }
  .state-btn {
    border-radius: 14px; padding: 16px 12px; min-height: 76px;
    display: grid; gap: 3px; justify-items: center; align-content: center;
    font-weight: 800; font-size: 15px; color: var(--btn-ink);
    border: 2px solid transparent;
  }
  .state-btn small { font-size: 11px; font-weight: 600; opacity: .92; }
  .state-btn.prod { background: var(--st-prod); }
  .state-btn.stop { background: var(--st-stop); }
  .state-btn.idle { background: var(--st-idle); }
  .state-btn.wait { background: var(--st-wait); }
  .state-btn.wait { color: #221a00; }
  :root[data-theme="dark"] .state-btn.wait, :root:not([data-theme="light"]) .state-btn.wait { color: #fff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .state-btn.wait { color: #221a00; } }
  .state-btn.current { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ring); }
  .state-btn:active { transform: scale(.97); }
  .state-btn .acc {
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    opacity: .95; margin-top: 2px; letter-spacing: .01em;
  }

  .pick-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--baseline);
    background: var(--page); font-size: 13px; font-weight: 600; color: var(--ink-2);
  }
  .pick.on { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }

  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: var(--page); border: 1px solid var(--ring); border-radius: 12px; padding: 10px 12px;
  }
  .kpi .k { font-size: 11px; color: var(--muted); font-weight: 600; }
  .kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; font-weight: 600; color: var(--muted); }

  .time-list { display: grid; gap: 8px; }
  .time-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 14px; }
  .toggle-row input {
    width: 42px; height: 24px; flex: none; appearance: none; -webkit-appearance: none;
    background: var(--track); border-radius: 999px; position: relative; transition: background .15s; cursor: pointer;
  }
  .toggle-row input:checked { background: var(--accent); }
  .toggle-row input::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .toggle-row input:checked::after { left: 21px; }
  .time-row .nm { flex: 1; color: var(--ink-2); }
  .time-row .tv { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---- cascata de tempo (manual) ---- */
  .wf { display: grid; }
  .wf-row {
    display: flex; align-items: flex-start; gap: 8px; font-size: 14px;
    padding: 8px 0; border-top: 1px solid var(--ring);
  }
  .wf-row:first-child { border-top: none; }
  .wf-row .op { width: 14px; flex: none; color: var(--muted); font-weight: 800; text-align: center; }
  .wf-row .nm { flex: 1; min-width: 0; color: var(--ink-2); }
  .wf-row .nm .sub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; line-height: 1.35; }
  .wf-row .tv { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wf-row.tot {
    border-top: none; margin-top: 6px; padding: 10px 12px;
    background: var(--track); border-radius: 12px;
  }
  .wf-row.tot .nm { color: var(--ink); font-weight: 700; }
  .wf-row.tot .tv { font-size: 16px; }
  .wf-row.tot.neg .nm, .wf-row.tot.neg .tv { color: var(--bad); }

  .callout {
    border: 1px dashed var(--baseline); background: var(--page);
    border-radius: 12px; padding: 11px 12px; font-size: 13px; color: var(--ink-2);
    line-height: 1.45; display: grid; gap: 9px;
  }
  .callout.warn { border-style: solid; border-color: var(--bad); color: var(--bad); }
  .callout.ok { border-color: var(--accent); }
  .callout .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .field input[readonly] { background: var(--track); color: var(--ink-2); border-style: dashed; }

  /* ---- campo com calculadora + eco do valor lido ---- */
  .field-head { display: flex; align-items: center; gap: 6px; }
  .field-head label { flex: 1; min-width: 0; }
  .mini-btn {
    width: 30px; height: 30px; flex: none; border-radius: 9px; border: 1px solid var(--baseline);
    background: var(--page); display: grid; place-items: center; font-size: 15px; line-height: 1;
  }
  .mini-btn:active { background: var(--accent-soft); border-color: var(--accent); }
  .field .echo { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 15px; }
  .field .echo b { color: var(--ink-2); font-weight: 700; }

  /* ---- calculadora de tempo ---- */
  .calc-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
  .calc-row .field { margin: 0; gap: 4px; }
  .calc-row .field label { font-size: 11px; }
  .calc-add { width: 46px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--btn-ink); font-size: 20px; font-weight: 800; }
  .calc-add:active { transform: scale(.96); }
  .calc-list { display: grid; gap: 6px; max-height: 28vh; overflow-y: auto; }
  .calc-item {
    display: flex; align-items: center; gap: 10px; font-size: 13.5px;
    padding: 8px 10px; background: var(--page); border-radius: 10px; border: 1px solid var(--ring);
  }
  .calc-item .nm { flex: 1; color: var(--ink-2); min-width: 0; }
  .calc-item .tv { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .calc-item button { color: var(--bad); font-weight: 800; padding: 0 2px; font-size: 15px; }
  .calc-total { display: flex; align-items: baseline; gap: 10px; padding: 11px 12px; background: var(--track); border-radius: 12px; }
  .calc-total .k { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .calc-total .v { flex: 1; text-align: right; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .calc-total .v small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }

  .btn {
    border-radius: 12px; padding: 14px; font-weight: 800; font-size: 15px;
    background: var(--accent); color: var(--btn-ink); width: 100%;
  }
  .btn.ghost { background: var(--page); color: var(--ink); border: 1px solid var(--ring); }
  .btn.danger { background: var(--bad); }
  .btn:active { transform: scale(.98); }

  /* ============ Dashboard ============ */
  .chips { display: flex; gap: 8px; overflow-x: auto; }
  .chips button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--ring);
    background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); flex: none;
  }
  .chips button.active { background: var(--accent); color: var(--btn-ink); border-color: var(--accent); }

  .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gauge { display: grid; justify-items: center; gap: 4px; min-width: 0; }
  .gauge svg { width: 100%; max-width: 104px; height: auto; }
  .gauge .glabel { font-size: 11px; font-weight: 700; color: var(--ink-2); text-align: center; }
  .gauge-hero { grid-column: 1 / -1; }
  .gauge-hero svg { max-width: 172px; }
  .gauge-hero .glabel { font-size: 12.5px; }
  .gauge .gmeta { font-size: 11px; color: var(--muted); }

  .stackbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--page); }
  .stackbar div { min-width: 3px; }
  .hbars { display: grid; gap: 10px; }
  .hbar .top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
  .hbar .top .n { color: var(--ink-2); font-weight: 600; }
  .hbar .top .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hbar .track { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 6px; background: var(--st-stop); min-width: 2px; }

  .mrow {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--grid);
  }
  .mrow:first-of-type { border-top: none; padding-top: 0; }
  .mrow svg { width: 74px; height: 74px; flex: none; }
  .mrow .info { flex: 1; min-width: 0; }
  .mrow .info .nm { font-weight: 700; font-size: 14.5px; }
  .mrow .info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mrow .mini { font-size: 11.5px; color: var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .mrow .mini b { font-weight: 700; }

  /* ============ Máquinas / forms ============ */
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select {
    padding: 12px; border-radius: 10px; border: 1px solid var(--baseline);
    background: var(--page); width: 100%;
  }
  .field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .list-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--grid);
  }
  .list-row:first-child { border-top: none; }
  .list-row .info { flex: 1; }
  .list-row .info .nm { font-weight: 700; }
  .list-row .info .sub { font-size: 12px; color: var(--muted); }
  .list-row .act { display: flex; gap: 6px; }
  .list-row .act button {
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--ring); background: var(--page); font-size: 13px;
  }
  .tagline { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagline span {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--ring); background: var(--page);
    border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 13px;
  }
  .tagline span button { color: var(--bad); font-weight: 800; padding: 0 4px; }

  /* ============ Modal / sheet ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 560px;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: grid; gap: 10px; max-height: 82vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 16px; }
  .sheet .opt {
    text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--ring);
    background: var(--page); font-weight: 600; font-size: 15px;
  }
  .sheet .opt:active { background: var(--accent-soft); }

  .empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  /* ============ Desktop ============ */
  header .desknav { display: none; }
  @media (min-width: 900px) {
    body { max-width: none; padding: 0 0 40px; }
    header {
      max-width: 1280px; margin: 0 auto; padding: 14px 28px;
      border-bottom: 1px solid var(--grid);
    }
    header h1 { font-size: 20px; flex: none; margin-right: 8px; }
    header .desknav { display: flex; gap: 4px; flex: 1; }
    header .desknav button {
      padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--ink-2);
    }
    header .desknav button.active { background: var(--accent-soft); color: var(--accent); }
    main { max-width: 1280px; margin: 0 auto; padding: 20px 28px; }
    nav { display: none; }
    .page.visible {
      display: grid; gap: 18px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }
    .page.visible > .card:first-child, .page.visible > .wide { grid-column: 1 / -1; }
    .state-grid { grid-template-columns: repeat(4, 1fr); }
    .state-btn { min-height: 92px; font-size: 16px; }
    .gauge-grid { grid-template-columns: repeat(5, 1fr); align-items: start; }
    .gauge-hero { grid-column: auto; }
    .gauge svg { max-width: 116px; }
    .gauge-hero svg { max-width: 146px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .sheet { border-radius: 18px; max-width: 620px; margin-bottom: 4vh; }
    .overlay { align-items: center; }
    .report-scroll svg { max-width: 1123px; }
  }
  @media (min-width: 1280px) {
    .page.visible { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .page.visible > .span2 { grid-column: span 2; }
  }

  .diff-pos { color: var(--good); }
  .diff-neg { color: var(--bad); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; vertical-align: 2px; white-space: nowrap;
  }
  .badge.planned { background: var(--accent-soft); color: var(--accent); }

<script>
/* =====================================================
   MES — Apontamento de produção, paradas e refugo
   ===================================================== */
/* ============================ FONTE ÚNICA DE VERSÃO =========================
   ⚠️ REGRA PERMANENTE — a cada mudança publicada:
      1. suba APP_VERSION;
      2. atualize APP_RELEASE_DATE para a data da publicação;
      3. replique o MESMO número no CACHE_NAME do sw.js ('mes-vX.Y.Z').
   Sem o passo 3 o aparelho com o PWA instalado continua na versão velha.
   Todo lugar que mostra versão lê daqui — não escreva o número na mão. */
var APP_VERSION = '2.5.1';
var APP_RELEASE_DATE = '2026-08-08';   /* AAAA-MM-DD */

var LAST_CHECK_KEY = 'tc_ultima_verificacao';
document.getElementById('verBadge').textContent = 'v' + APP_VERSION;
document.getElementById('splashVer').textContent = 'v' + APP_VERSION;

const STATES = {
  prod: { label: 'Produzindo',            btn: 'Produção',  sub: 'contagem teórica ativa', color: 'var(--st-prod)', cls: 'prod' },
  stop: { label: 'Parada',                btn: 'Parada',    sub: 'informar motivo',        color: 'var(--st-stop)', cls: 'stop' },
  idle: { label: 'Ociosa — sem insumo',   btn: 'Ociosa',    sub: 'sem insumo',             color: 'var(--st-idle)', cls: 'idle' },
  wait: { label: 'Esperando linha',       btn: 'Esperando', sub: 'máquina da frente',      color: 'var(--st-wait)', cls: 'wait' },
};
const STATE_ORDER = ['prod', 'stop', 'idle', 'wait'];
/* classificação da parada — alimenta MTBF / MTBB / MTTA / MTTR */
const STOP_KINDS = {
  fail:  { label: 'Falha',       hint: 'sensor, alarme, travamento, erro de automação' },
  break: { label: 'Quebra',      hint: 'dano físico — exige reparo ou troca de peça' },
  op:    { label: 'Operacional', hint: 'setup, limpeza, falta de operador…' },
};
const DEFAULT_OEE_TARGET = 85; /* % */

/* ---------- persistência ---------- */
const KEY = 'mes_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.machines) {
      /* migração v1.1 → v1.2: motivos eram textos; agora têm descrição e planejada/não planejada */
      if (d.reasons && d.reasons.length && typeof d.reasons[0] === 'string') {
        d.reasons = d.reasons.map(n => ({ id: uid(), name: n, desc: '', planned: /setup|troca|limpeza/i.test(n) }));
      }
      /* v2.0: configuração de cálculo (espera/ociosidade contam como parada da máquina?) */
      if (!d.calc) d.calc = { idleCountsAsStop: false, waitCountsAsStop: false };
      return d;
    }
  } catch (e) {}
  return {
    machines: [],
    reasons: [
      { id: uid(), name: 'Manutenção corretiva', desc: 'Intervenção técnica não programada', planned: false },
      { id: uid(), name: 'Setup / Troca',        desc: 'Troca de produto, ferramenta ou lote', planned: true, stdMin: 10 },
      { id: uid(), name: 'Ajuste de processo',   desc: '', planned: false },
      { id: uid(), name: 'Falta de operador',    desc: '', planned: false },
      { id: uid(), name: 'Qualidade',            desc: 'Bloqueio ou inspeção de qualidade', planned: false },
      { id: uid(), name: 'Limpeza',              desc: 'Higienização programada', planned: true },
      { id: uid(), name: 'Outro',                desc: '', planned: false },
    ],
    sessions: [],
    active: null,
    theme: null,
    period: '7d',
    askDetail: true, /* pedir motivo ao marcar parada (false = parada simples, detalhar depois) */
    calc: { idleCountsAsStop: false, waitCountsAsStop: false },
  };
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
const reasonPlannedByName = n => { const r = db.reasons.find(x => x.name === n); return r ? !!r.planned : false; };
/* motivos aplicáveis a uma máquina — machineIds vazio/ausente = todas as máquinas */
const reasonsFor = machineId => db.reasons.filter(r =>
  !r.machineIds || !r.machineIds.length || (machineId && r.machineIds.includes(machineId)));
const reasonScopeLabel = r => {
  if (!r.machineIds || !r.machineIds.length) return 'todas as máquinas';
  const names = r.machineIds.map(id => { const m = machineById(id); return m ? m.name : null; }).filter(Boolean);
  return names.length ? names.join(', ') : 'máquina removida';
};

/* =====================================================
   NUVEM — Supabase (autenticação + acesso REST)
   =====================================================
   Camada fina sobre GoTrue e PostgREST feita com fetch. O app não tem
   dependência nenhuma e precisa abrir offline; puxar um SDK de CDN quebraria
   as duas coisas, e vendorizar o bundle custaria mais do que estas ~80 linhas.

   A chave abaixo é a *publishable*: pública por natureza, vai no repo e no
   HTML sem problema. Quem protege os dados é o RLS do banco — nunca o segredo
   da chave. Ver supabase/README.md.

   Nada aqui sincroniza dados ainda: o app segue rodando 100% do localStorage,
   e continua funcionando por completo sem login e sem internet.
   ===================================================== */
const SUPABASE = {
  url: 'https://dupqpzgtcnukgusyutkg.supabase.co',
  key: 'sb_publishable_7GF6g8BDJYHdTWyWqc1gSQ_EIvZ3GZs',
};
/* sessão fica fora do `db` de propósito: token não é dado de produção e não
   pode acabar viajando junto na sincronização */
const AUTH_KEY = 'mes_auth_v1';
let auth = (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } })();
function saveAuth() {
  if (auth) localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
  else localStorage.removeItem(AUTH_KEY);
}
const cloudOn   = () => !!(SUPABASE.url && SUPABASE.key);
const signedIn  = () => !!(auth && auth.access_token);
const hasOrg    = () => !!(auth && auth.org);

/* mensagem de erro legível, venha ela do GoTrue, do PostgREST ou da rede */
function sbErrMsg(data, status) {
  const m = data && (data.error_description || data.msg || data.message || data.error || data.hint);
  if (m === 'Invalid login credentials') return 'e-mail ou senha inválidos';
  if (m === 'Email not confirmed') return 'e-mail ainda não confirmado — veja a caixa de entrada';
  return m || ('erro ' + (status || ''));
}

async function sbCall(path, opts) {
  const o = opts || {};
  let res;
  try {
    res = await fetch(SUPABASE.url + path, {
      method: o.method || 'GET',
      headers: Object.assign({ apikey: SUPABASE.key, 'Content-Type': 'application/json' },
        o.token ? { Authorization: 'Bearer ' + o.token } : {}, o.headers || {}),
      body: o.body === undefined ? undefined : JSON.stringify(o.body),
    });
  } catch (e) {
    throw new Error('sem conexão com a internet');
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { message: text }; }
  if (!res.ok) throw new Error(sbErrMsg(data, res.status));
  return o.raw ? { data, headers: res.headers } : data;
}

function applySession(d) {
  auth = {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: Date.now() + (d.expires_in || 3600) * 1000,
    user: { id: d.user && d.user.id, email: d.user && d.user.email },
    org: auth && auth.org || null,
  };
  saveAuth();
}

/* token válido, renovando quando falta menos de 1min */
async function sbToken() {
  if (!signedIn()) throw new Error('entre na sua conta primeiro');
  if (auth.expires_at && auth.expires_at - Date.now() > 60000) return auth.access_token;
  try {
    applySession(await sbCall('/auth/v1/token?grant_type=refresh_token',
      { method: 'POST', body: { refresh_token: auth.refresh_token } }));
  } catch (e) {
    if (/conexão/.test(e.message)) throw e;   /* offline: não desloga o operador */
    auth = null; saveAuth();
    throw new Error('sua sessão expirou — entre de novo');
  }
  return auth.access_token;
}

async function sbApi(path, opts) {
  const token = await sbToken();
  return sbCall('/rest/v1' + path, Object.assign({}, opts, { token }));
}
const sbRpc = (fn, args) => sbApi('/rpc/' + fn, { method: 'POST', body: args || {} });

/* quantas linhas existem lá, sem trazer o payload.
   Content-Range não é header liberado por padrão no CORS: se o gateway não o
   expuser ao JS, a leitura volta vazia — daí o fallback contando as linhas,
   que é lento mas nunca mente dizendo zero. */
async function sbCount(table) {
  const r = await sbApi('/' + table + '?select=id', {
    headers: { Prefer: 'count=exact', Range: '0-0' }, raw: true });
  const n = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
  if (isFinite(n)) return n;
  const rows = await sbApi('/' + table + '?select=id');
  return rows ? rows.length : 0;
}

/* ---------- ações ---------- */
async function cloudLoadOrg() {
  const rows = await sbApi('/profiles?select=role,orgs(id,name,join_code)&user_id=eq.' + auth.user.id);
  const r = rows && rows[0];
  auth.org = r && r.orgs ? { id: r.orgs.id, name: r.orgs.name, joinCode: r.orgs.join_code, role: r.role } : null;
  saveAuth();
}
async function cloudSignIn(email, password) {
  applySession(await sbCall('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password } }));
  await cloudLoadOrg();
}
/* devolve false quando o projeto exige confirmação de e-mail */
async function cloudSignUp(email, password) {
  const d = await sbCall('/auth/v1/signup', { method: 'POST', body: { email, password } });
  if (!(d && d.access_token)) return false;
  applySession(d);
  await cloudLoadOrg();
  return true;
}
async function cloudSignOut() {
  try {
    await sbCall('/auth/v1/logout', { method: 'POST', token: auth && auth.access_token });
  } catch (e) { /* offline ou token vencido: encerrar localmente já basta */ }
  auth = null; saveAuth();
}
const cloudCreateOrg = name => sbRpc('bootstrap_org', { org_name: name }).then(cloudLoadOrg);
const cloudJoinOrg   = code => sbRpc('join_org', { code: code }).then(cloudLoadOrg);

/* ---------- tema ---------- */
function applyTheme() {
  if (db.theme) document.documentElement.dataset.theme = db.theme;
  else delete document.documentElement.dataset.theme;
}
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  db.theme = dark ? 'light' : 'dark';
  save(); applyTheme();
};
applyTheme();

/* ---------- wake lock (tela sempre acesa) ---------- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeInd').classList.add('on');
      wakeLock.addEventListener('release', () => document.getElementById('wakeInd').classList.remove('on'));
    }
  } catch (e) { /* precisa de HTTPS + interação em alguns navegadores */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
window.addEventListener('click', () => { if (!wakeLock || wakeLock.released) keepAwake(); }, { once: false });
keepAwake();

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
               : `${m}:${String(ss).padStart(2,'0')}`;
}
function fmtDurLong(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  if (h > 0) return `${h}h ${m}min`;
  if (m > 0) return `${m}min`;
  return `${s}s`;
}
const fmtInt = n => Math.round(n).toLocaleString('pt-BR');
const pct = (x, dig=1) => (x * 100).toFixed(dig).replace('.', ',') + '%';

/* segmentos de uma sessão (ativa: fecha o atual em "now") */
function segsOf(sess, now) {
  const out = sess.segs.map(s => ({ ...s }));
  if (sess.current) out.push({ ...sess.current, end: now || Date.now() });
  return out;
}
function totals(sess, now) {
  const t = { prod: 0, stop: 0, idle: 0, wait: 0, total: 0 };
  for (const s of segsOf(sess, now)) {
    const d = Math.max(0, (s.end || now || Date.now()) - s.start);
    t[s.state] += d; t.total += d;
  }
  return t;
}
function theoOf(sess, machine, now) {
  return totals(sess, now).prod / 60000 * (machine ? machine.rate : 0);
}
const machineById = id => db.machines.find(m => m.id === id);

/* =====================================================
   TABS
   ===================================================== */
let tab = 'apontar';
const tabButtons = () => document.querySelectorAll('nav button, header .desknav button');
function goTab(t) {
  tab = t;
  tabButtons().forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  render();
}
tabButtons().forEach(b => { b.onclick = () => goTab(b.dataset.tab); });
function showPage() {
  for (const p of ['apontar', 'manual', 'dash', 'maq'])
    $('#page-' + p).classList.toggle('visible', tab === p);
}

/* =====================================================
   APONTAR
   ===================================================== */
function renderApontar() {
  const el = $('#page-apontar');
  const a = db.active;

  if (!a) {
    if (db.machines.length === 0) {
      el.innerHTML = `<div class="card"><div class="empty"><div class="big">⚙</div>
        Nenhuma máquina cadastrada.<br>Cadastre uma máquina na aba <b>Máquinas</b> para começar a apontar.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="card">
      <h2>Iniciar apontamento</h2>
      <p class="hint" style="margin-bottom:12px">Escolha a máquina que você vai acompanhar. O cronômetro começa quando você tocar no primeiro estado.</p>
      <div class="machine-pick">${db.machines.map(m => `
        <button data-start="${m.id}">
          <span><span class="nm">${esc(m.name)}</span><br><span class="rt">${esc(m.sector || '')}</span></span>
          <span class="rt">${fmtInt(m.rate)} pçs/min ›</span>
        </button>`).join('')}
      </div></div>`;
    el.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startSession(b.dataset.start));
    return;
  }

  const m = machineById(a.machineId);
  const cur = a.current;
  const curSt = cur ? STATES[cur.state] : null;

  el.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <div><div style="font-weight:800;font-size:17px">${esc(m ? m.name : '?')}</div>
        <div class="hint">${fmtInt(m ? m.rate : 0)} pçs/min nominal · início ${new Date(a.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <div style="text-align:right"><div class="hint">tempo total</div>
        <div style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums" id="tTotal">0:00</div></div>
      </div>

      <div class="now-state ${cur ? '' : 'none'}" style="${cur ? 'background:' + curSt.color : ''}">
        <span class="lbl">${cur ? esc(segLabel(cur)) : 'Toque em um estado para começar'}</span>
        <span class="tm" id="tState">${cur ? '' : '—'}</span>
      </div>

      ${cur && cur.state === 'stop' && !cur.reason ? '<div style="height:10px"></div><button class="btn ghost" id="detailBtn">📝 Definir motivo da parada (opcional)</button>' : ''}

      ${cur && cur.state === 'stop' && cur.planned && cur.stdMs ? '<p class="hint" id="stdHint" style="margin-top:8px"></p>' : ''}
      ${cur && cur.state === 'stop' && cur.kind && cur.kind !== 'op' ? (
        cur.maintAt
          ? `<p class="hint" style="margin-top:8px">🔧 Manutenção chegou às ${new Date(cur.maintAt).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})} (atendimento em ${fmtDurLong(cur.maintAt - cur.start)}) — em reparo.</p>`
          : `<div style="height:10px"></div><button class="btn ghost" id="maintBtn">🔧 Manutenção chegou (marca o MTTA)</button>`
      ) : ''}

      <div style="height:12px"></div>
      <div class="state-grid">
        ${STATE_ORDER.map(k => `
          <button class="state-btn ${STATES[k].cls} ${cur && cur.state === k ? 'current' : ''}" data-state="${k}">
            ${STATES[k].btn}<small>${STATES[k].sub}</small>
            <small class="acc" id="acc-${k}">0:00</small>
          </button>`).join('')}
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="detailToggle" ${db.askDetail !== false ? 'checked' : ''}>
        <span>Pedir motivo ao marcar <b>Parada</b> — desligue para apontar só “parou” e detalhar depois</span>
      </div>
    </div>

    <div class="card">
      <h2>Produção</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="k">Contagem teórica</div><div class="v" id="theoV">0 <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Ritmo nominal</div><div class="v">${fmtInt(m ? m.rate : 0)} <small>pçs/min</small></div></div>
      </div>
      <div class="kpi-row" style="margin-top:10px">
        <div class="field" style="margin:0"><label for="pReal">Produção parcial (pçs)</label>
          <input id="pReal" type="number" inputmode="numeric" min="0" placeholder="opcional" value="${a.partialReal != null ? a.partialReal : ''}"></div>
        <div class="field" style="margin:0"><label for="pScrap">Refugo parcial (pçs)</label>
          <input id="pScrap" type="number" inputmode="numeric" min="0" placeholder="0" value="${a.partialScrap != null ? a.partialScrap : ''}"></div>
      </div>
      <div class="kpi-row" style="margin-top:10px">
        <div class="kpi"><div class="k">Média real</div><div class="v" id="avgV">— <small>pçs/min</small></div></div>
        <div class="kpi"><div class="k">Microparadas</div><div class="v" id="microV">—</div></div>
      </div>
      <div class="kpi-row" style="margin-top:10px">
        <div class="kpi"><div class="k">OEE parcial — real (linha)</div><div class="v" id="oeeRealV">—</div></div>
        <div class="kpi"><div class="k">OEE parcial — máquina</div><div class="v" id="oeeMachV">—</div></div>
      </div>
      <p class="hint" style="margin-top:10px" id="prodHint">Informe a produção parcial a qualquer momento para acompanhar média, microparadas e OEE ao vivo. A contagem teórica sobe apenas em <b>Produção</b>.</p>

    <div class="card">
      <h2>Tempos acumulados</h2>

      ${a.segs.length + (cur ? 1 : 0)

        : '<p class="hint">Nada marcado ainda.</p>'}
    </div>

    <div class="wide" style="display:grid;gap:10px;grid-auto-flow:column">
      <button class="btn" id="finishBtn">✓ Finalizar e apontar produção real</button>
      <button class="btn ghost" id="cancelBtn">Descartar apontamento</button>
    </div>`;

  el.querySelectorAll('[data-state]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.state;
      if (k === 'stop') { db.askDetail !== false ? openReasonSheet() : setState('stop'); }
      else setState(k);
    };
  });
  $('#detailToggle').onchange = e => { db.askDetail = e.target.checked; save(); };
  const savePartial = () => {
    const r = parseFloat($('#pReal').value), s = parseFloat($('#pScrap').value);
    a.partialReal = r >= 0 ? r : null;
    a.partialScrap = s >= 0 ? s : null;
    save(); tick();
  };
  $('#pReal').oninput = savePartial;
  $('#pScrap').oninput = savePartial;
  const db_ = $('#detailBtn'); if (db_) db_.onclick = () => openSegReasonSheet('cur');
  el.querySelectorAll('[data-editseg]').forEach(b => b.onclick = () => {
    const v = b.dataset.editseg;
    openSegEditSheet(v === 'cur' ? 'cur' : +v);
  });
  const mb = $('#maintBtn'); if (mb) mb.onclick = markMaintArrived;
  $('#finishBtn').onclick = openFinishSheet;
  $('#cancelBtn').onclick = () => {
    openSheet(`<h3>Descartar apontamento?</h3>
      <p class="hint">Todos os tempos desta medição serão perdidos.</p>
      <button class="btn danger" id="cfDel">Sim, descartar</button>
      <button class="btn ghost" id="cfNo">Voltar</button>`);
    $('#cfDel').onclick = () => { db.active = null; save(); closeSheet(); render(); };
    $('#cfNo').onclick = closeSheet;
  };
  tick();
}

function startSession(machineId) {
  db.active = { id: uid(), machineId, start: Date.now(), segs: [], current: null };
  save(); render();
}

/* trocar de estado: fecha o segmento atual (qualquer categoria interrompe a produção) */
function setState(state, reason, kind, planned, stdMs) {
  const a = db.active; if (!a) return;
  const now = Date.now();
  if (a.current) {
    if (a.current.state === state && (a.current.reason || null) === (reason || null)) return;
    a.segs.push({ ...a.current, end: now });
  }
  a.current = { state, reason: reason || null, kind: kind || null,
    planned: planned === undefined ? null : !!planned,
    stdMs: stdMs > 0 ? stdMs : null, start: now };
  save(); render();
}

const plannedBadge = p => `<span class="badge ${p ? 'planned' : 'unplanned'}">${p ? 'planejada' : 'não planejada'}</span>`;

function openReasonSheet() {
  const list = reasonsFor(db.active ? db.active.machineId : null);
  openSheet(`<h3>Motivo da parada</h3>
    ${list.length ? list.map(r => `<button class="opt" data-r="${r.id}">
      <b>${esc(r.name)}</b> ${plannedBadge(r.planned)}${r.planned && r.stdMin > 0 ? ` <span class="hint">padrão ${r.stdMin}min</span>` : ''}
      ${r.desc ? `<br><span class="hint">${esc(r.desc)}</span>` : ''}</button>`).join('')
      : '<p class="hint">Nenhum motivo cadastrado para esta máquina. Cadastre em Máquinas → Motivos de parada.</p>'}
    <button class="btn ghost" id="rCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = db.reasons.find(x => x.id === b.dataset.r);
    if (r.planned) { setState('stop', r.name, 'op', true, (r.stdMin || 0) * 60000); closeSheet(); } /* planejada não é falha/quebra */
    else openKindSheet(r);
  });
  $('#rCancel').onclick = closeSheet;
}

function openKindSheet(r) {
  openSheet(`<h3>Tipo da parada — ${esc(r.name)}</h3>
    <p class="hint">A classificação alimenta os indicadores MTBF, MTBB, MTTA e MTTR.</p>
    ${Object.entries(STOP_KINDS).map(([k, v]) =>
      `<button class="opt" data-k="${k}"><b>${v.label}</b><br><span class="hint">${v.hint}</span></button>`).join('')}
    <button class="btn ghost" id="kCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    setState('stop', r.name, b.dataset.k, r.planned); closeSheet();
  });
  $('#kCancel').onclick = closeSheet;
}

/* ---------- lista de marcações da medição (editável) ---------- */
function segLabel(seg) {
  let l = STATES[seg.state].label;
  if (seg.state === 'stop') l += seg.reason ? ' — ' + seg.reason : ' — sem motivo';
  if (seg.kind && seg.kind !== 'op') l += ' · ' + STOP_KINDS[seg.kind].label;
  return l;
}
const fmtHM = ms => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function renderSegList(a) {
  const row = (idx, seg, live) => `
    <div class="list-row">
      <span class="sw" style="background:${STATES[seg.state].color}"></span>
      <div class="info">
        <div class="nm" style="font-size:13.5px">${esc(segLabel(seg))}
          ${seg.state === 'stop' && seg.planned != null ? plannedBadge(seg.planned) : ''}
          ${live ? '<span style="color:var(--good);font-size:11px">● agora</span>' : ''}</div>
        <div class="sub">${fmtHM(seg.start)}–${live ? '…' : fmtHM(seg.end)} · <span ${live ? 'id="curSegDur"' : ''}>${fmtDur((live ? Date.now() : seg.end) - seg.start)}</span></div>
      </div>
      <div class="act"><button data-editseg="${idx}" aria-label="corrigir">✎</button></div>
    </div>`;
  const rows = [];
  if (a.current) rows.push(row('cur', a.current, true));
  for (let i = a.segs.length - 1; i >= 0; i--) rows.push(row(i, a.segs[i], false));
  return rows.join('');
}

/* alvo do editor de marcação: apontamento ativo (padrão) ou uma sessão fechada (sessId) */
function segTarget(idx, sessId) {
  if (sessId) { const s = db.sessions.find(x => x.id === sessId); return s ? s.segs[idx] : null; }
  const a = db.active; if (!a) return null;
  return idx === 'cur' ? a.current : a.segs[idx];
}

function applySegEdit(idx, patch, sessId) {
  const seg = segTarget(idx, sessId);
  if (!seg) return;
  Object.assign(seg, patch);
  if (seg.state !== 'stop') { seg.reason = null; seg.kind = null; seg.planned = null; seg.stdMs = null; delete seg.maintAt; }
  else if (!seg.kind || seg.kind === 'op') delete seg.maintAt;
  if (sessId) {
    /* sessão fechada: recalcula a teórica, pois o tempo produzindo pode ter mudado */
    const s = db.sessions.find(x => x.id === sessId);
    const m = machineById(s.machineId);
    s.theo = totals(s).prod / 60000 * (m ? m.rate : 0);
  }
  save();
  if (sessId) { render(); openSessionEditSheet(sessId); }
  else { closeSheet(); render(); }
}

function openSegEditSheet(idx, sessId) {
  const seg = segTarget(idx, sessId);
  if (!seg) return;
  openSheet(`<h3>Corrigir marcação</h3>
    <p class="hint">${esc(segLabel(seg))} · ${fmtHM(seg.start)}–${!sessId && idx === 'cur' ? 'agora' : fmtHM(seg.end)}</p>
    ${STATE_ORDER.map(k => `<button class="opt" data-k="${k}" ${k === seg.state ? 'style="outline:2px solid var(--accent)"' : ''}>
      <b>${STATES[k].label}</b>${k === 'stop' ? '<br><span class="hint">escolhe o motivo em seguida</span>' : ''}</button>`).join('')}
    <button class="btn ghost" id="seCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'stop') openSegReasonSheet(idx, sessId);
    else applySegEdit(idx, { state: k }, sessId);
  });
  $('#seCancel').onclick = () => sessId ? openSessionEditSheet(sessId) : closeSheet();
}

function openSegReasonSheet(idx, sessId) {
  const mid = sessId ? (db.sessions.find(x => x.id === sessId) || {}).machineId : (db.active || {}).machineId;
  openSheet(`<h3>Motivo da parada</h3>

    ${reasonsFor(mid).map(r => `<button class="opt" data-r="${r.id}">
      <b>${esc(r.name)}</b> ${plannedBadge(r.planned)}${r.planned && r.stdMin > 0 ? ` <span class="hint">padrão ${r.stdMin}min</span>` : ''}
      ${r.desc ? `<br><span class="hint">${esc(r.desc)}</span>` : ''}</button>`).join('')}
    <button class="btn ghost" id="srCancel">Cancelar</button>`);
  $('#sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    if (b.dataset.r === 'none') return applySegEdit(idx, { state: 'stop', reason: null, kind: null, planned: null, stdMs: null }, sessId);
    const r = db.reasons.find(x => x.id === b.dataset.r);
    if (r.planned) applySegEdit(idx, { state: 'stop', reason: r.name, kind: 'op', planned: true, stdMs: (r.stdMin || 0) * 60000 }, sessId);

}

function openSegKindSheet(idx, r, sessId) {
  openSheet(`<h3>Tipo da parada — ${esc(r.name)}</h3>
    ${Object.entries(STOP_KINDS).map(([k, v]) =>
      `<button class="opt" data-k="${k}"><b>${v.label}</b><br><span class="hint">${v.hint}</span></button>`).join('')}
    <button class="btn ghost" id="skCancel">Cancelar</button>`);

function reopenSession(id) {
  if (db.active) return; /* só sem apontamento em andamento */
  const i = db.sessions.findIndex(x => x.id === id); if (i < 0) return;
  const s = db.sessions.splice(i, 1)[0];
  /* volta a ser o apontamento ativo; o intervalo fechado→reaberto não conta em nenhum tempo
     (os tempos são somados só dos segmentos marcados) */
  db.active = { id: s.id, machineId: s.machineId, start: s.start, segs: s.segs, current: null,
    prevReal: s.real, prevScrap: s.scrap, manual: s.manual || undefined };
  save(); closeSheet();
  goTab('apontar');
}

/* registrar chegada da manutenção na parada atual (MTTA / MTTR) */
function markMaintArrived() {
  const a = db.active;
  if (a && a.current && a.current.state === 'stop' && !a.current.maintAt) {
    a.current.maintAt = Date.now();
    save(); render();
  }
}

function openFinishSheet() {
  const a = db.active; if (!a) return;
  const m = machineById(a.machineId);
  const theo = theoOf(a, m);
  openSheet(`<h3>Finalizar apontamento — ${esc(m ? m.name : '')}</h3>
    <div class="kpi"><div class="k">Produção teórica (${fmtDurLong(totals(a).prod)} produzindo)</div>
      <div class="v">${fmtInt(theo)} <small>pçs</small></div></div>
    <div class="field"><label for="fReal">Produção real (peças contadas)</label>
      <input id="fReal" type="number" inputmode="numeric" min="0" placeholder="0" value="${a.prevReal != null ? a.prevReal : (a.partialReal != null ? a.partialReal : '')}"></div>
    <div class="field"><label for="fScrap">Refugo (peças ruins, dentro do total real)</label>
      <input id="fScrap" type="number" inputmode="numeric" min="0" value="${a.prevScrap != null ? a.prevScrap : (a.partialScrap != null ? a.partialScrap : 0)}"></div>
    <div class="hint" id="fPreview"></div>
    <button class="btn" id="fSave">Salvar apontamento</button>
    <button class="btn ghost" id="fBack">Voltar</button>`);
  const upd = () => {
    const real = +$('#fReal').value || 0;
    const diff = real - theo;
    $('#fPreview').innerHTML = real > 0
      ? `Diferença real − teórica: <b class="${diff >= 0 ? 'diff-pos' : 'diff-neg'}">${diff >= 0 ? '+' : ''}${fmtInt(diff)} pçs (${pct(theo > 0 ? real / theo : 0)} do teórico)</b>`
      : '';
