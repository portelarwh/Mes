/* =====================================================
   SERVICE WORKER — atualização automática
   =====================================================
   O app roda num subcaminho do GitHub Pages de projeto, então tudo aqui é
   relativo: 'sw.js', nunca '/sw.js'. `updateViaCache: 'none'` impede que o
   próprio sw.js seja servido do cache HTTP do browser — sem isso o aparelho
   pode ficar preso numa versão por até 24h.                                   */
function checarAtualizacao() {
  localStorage.setItem(LAST_CHECK_KEY, new Date().toISOString());
  const reg = window._swReg;
  return reg ? Promise.resolve(reg.update()).catch(() => {}) : Promise.resolve();
}

/* não trocar de versão no meio de uma edição: reload perderia o que está aberto */
const modalAberto = () =>
  !!(document.querySelector('#overlay.open') || document.querySelector('#repOverlay.open'));

function aplicarAtualizacao(worker) {
  if (!worker) return;
  if (modalAberto()) { mostrarBannerUpdate(worker); return; }
  worker.postMessage({ type: 'SKIP_WAITING' });
}

function mostrarBannerUpdate(worker) {
  if (document.getElementById('updBanner')) return;
  const el = document.createElement('div');
  el.id = 'updBanner';
  el.className = 'upd-banner';
  el.innerHTML = '<span>Nova versão disponível.</span><button class="pick">Atualizar</button>';
  el.querySelector('button').onclick = () => {
    el.remove();
    worker.postMessage({ type: 'SKIP_WAITING' });
  };
  document.body.appendChild(el);
}

if ('serviceWorker' in navigator) {
  /* já havia um SW no comando? se não, esta é a primeira instalação e o
     clients.claim() não deve disparar reload nenhum */
  const tinhaController = !!navigator.serviceWorker.controller;
  let recarregando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!tinhaController || recarregando) return;
    recarregando = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      window._swReg = reg;
      if (reg.waiting) aplicarAtualizacao(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) aplicarAtualizacao(worker);
        });
      });
      checarAtualizacao();
    }).catch(() => { /* http sem TLS, navegador antigo: o app funciona igual */ });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checarAtualizacao();
  });
  setInterval(checarAtualizacao, 30 * 60 * 1000);
}

/* =====================================================
   INSTALAÇÃO — PWA de verdade, não atalho
   =====================================================
   Atalho é o que o Android cria quando o site não cumpre os critérios de
   instalação (ícone PNG de 192 e 512, manifest com start_url/scope/display e
   um service worker com handler de fetch). Cumpridos os critérios, o Chrome
   dispara `beforeinstallprompt` e gera um WebAPK — aí o app tem ícone próprio,
   abre sem barra de endereço e conta como aplicativo instalado.             */
let deferredPrompt = null;
const DISMISS_KEY = 'mes_install_dispensado';

/* rodando como app instalado? */
const appInstalado = () =>
  ['standalone', 'fullscreen', 'minimal-ui'].some(m => matchMedia('(display-mode: ' + m + ')').matches)
  || navigator.standalone === true;

const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();               /* guardamos para disparar no clique do usuário */
  deferredPrompt = e;
  renderInstallCard();
  if (!appInstalado() && !localStorage.getItem(DISMISS_KEY)) mostrarBannerInstall();
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  localStorage.removeItem(DISMISS_KEY);
  const b = document.getElementById('instBanner'); if (b) b.remove();
  renderInstallCard();
});

function mostrarBannerInstall() {
  if (document.getElementById('instBanner') || document.getElementById('updBanner')) return;
  const el = document.createElement('div');
  el.id = 'instBanner';
  el.className = 'upd-banner';
  el.innerHTML = '<span>Instale o MES no aparelho.</span><button class="pick">Instalar</button><button class="pick ghost-x" aria-label="Dispensar">✕</button>';
  const [inst, close] = el.querySelectorAll('button');
  inst.onclick = () => { el.remove(); dispararInstall(); };
  close.onclick = () => { el.remove(); localStorage.setItem(DISMISS_KEY, '1'); };
  document.body.appendChild(el);
}

/* A mensagem vive no estado, não no DOM: `renderInstallCard` roda de novo assim
   que o prompt se resolve, e uma mensagem escrita direto no elemento seria
   apagada antes de o operador ler. */
let installMsg = '';
function dispararInstall() {
  if (!deferredPrompt) {
    installMsg = 'O navegador não ofereceu a instalação agora; recarregue a página e tente de novo.';
    renderInstallCard();
    return Promise.resolve('indisponivel');
  }
  const p = deferredPrompt;
  deferredPrompt = null;
  p.prompt();
  return p.userChoice.then(r => {
    installMsg = r.outcome === 'accepted'
      ? 'Instalando… procure o ícone do MES na tela inicial e abra o app por lá.'
      : 'Instalação cancelada. Para instalar depois, use o menu ⋮ do navegador → “Instalar aplicativo”.';
    renderInstallCard();
    return r.outcome;
  }).catch(() => { renderInstallCard(); return 'indisponivel'; });
}

function renderInstallCard() {
  const el = document.getElementById('installCard'); if (!el) return;
  const head = '<h2>Instalação</h2>';

  const msg = `<p class="hint" id="instMsg" style="margin-top:10px">${esc(installMsg)}</p>`;

  if (appInstalado()) {
    el.innerHTML = `${head}<p class="hint">✓ Rodando como <b>app instalado</b> — sem barra de endereço, com ícone próprio e atualização automática em segundo plano.</p>`;
    return;
  }
  if (deferredPrompt) {
    el.innerHTML = `${head}
      <p class="hint" style="margin-bottom:12px">Você está usando o MES pelo navegador. Instale para ter <b>ícone próprio</b>, abrir em tela cheia e continuar funcionando offline — é o app de verdade, não um atalho.</p>
      <button class="btn" id="instBtn">📲 Instalar app</button>${msg}`;
    $('#instBtn').onclick = () => dispararInstall();
    return;
  }
  if (ehIOS()) {
    el.innerHTML = `${head}
      <p class="hint">No iPhone/iPad a instalação é manual: toque em <b>Compartilhar</b> (⬆️) na barra do Safari e escolha <b>“Adicionar à Tela de Início”</b>. O app passa a abrir em tela cheia, com ícone próprio.</p>${msg}`;
    return;
  }
  el.innerHTML = `${head}
    <p class="hint">Este navegador ainda não ofereceu a instalação. Ela aparece no <b>Chrome ou Edge</b>, com o site aberto por <b>HTTPS</b> — no menu ⋮ procure <b>“Instalar aplicativo”</b>. Se o app já estiver instalado, abra pelo ícone da tela inicial.</p>${msg}`;
}

/* ---------- pop-up de versão (badge no topo) ---------- */
const fmtDateBR = iso => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '—');
};
const fmtUltimaVerificacao = () => {
  const v = localStorage.getItem(LAST_CHECK_KEY);
  if (!v) return 'nunca';
  const d = new Date(v);
  return isNaN(d) ? 'nunca' : d.toLocaleString('pt-BR');
};

function openVersionSheet() {
  const row = (val, sub, id) => `<div class="list-row"><div class="info">
      <div class="nm"${id ? ` id="${id}"` : ''}>${esc(val)}</div>
      <div class="sub">${sub}</div></div></div>`;
  openSheet(`
    <h3>Versão do app</h3>
    ${row('v' + APP_VERSION, 'instalada neste aparelho')}
    ${row(fmtDateBR(APP_RELEASE_DATE), 'publicada em')}
    ${row(fmtUltimaVerificacao(), 'última verificação', 'vLast')}
    ${row(appInstalado() ? 'app instalado' : 'navegador', 'como está aberto agora')}
    <p class="hint" id="vMsg"></p>
    <button class="btn" id="vCheck">Verificar agora</button>
    <button class="btn ghost" id="vClose">Fechar</button>`);

  $('#vClose').onclick = closeSheet;
  $('#vCheck').onclick = () => {
    const b = $('#vCheck'), msg = $('#vMsg');
    if (!('serviceWorker' in navigator) || !window._swReg) {
      msg.innerHTML = '<span style="color:var(--bad)">Este navegador não instalou o atualizador automático — recarregue a página para pegar a versão nova.</span>';
      return;
    }
    b.disabled = true; b.textContent = 'verificando…'; msg.textContent = '';
    const reg = window._swReg;
    Promise.resolve(reg.update()).then(() => {
      localStorage.setItem(LAST_CHECK_KEY, new Date().toISOString());
      $('#vLast').textContent = fmtUltimaVerificacao();
      const worker = reg.waiting || reg.installing;
      if (worker) {
        msg.innerHTML = '<b style="color:var(--good)">Nova versão encontrada! Aplicando…</b>';
        worker.postMessage({ type: 'SKIP_WAITING' });
      } else {
        msg.textContent = 'Você já está na versão mais recente disponível no servidor.';
      }
    }).catch(e => {
      msg.innerHTML = `<span style="color:var(--bad)">Não foi possível verificar: ${esc(e.message || 'sem conexão')}</span>`;
    }).finally(() => { b.disabled = false; b.textContent = 'Verificar agora'; });
  };
}

/* =====================================================
   Render raiz
   ===================================================== */
function render() {
  showPage();
  if (tab === 'apontar') renderApontar();
  if (tab === 'manual') renderManual();
  if (tab === 'dash') renderDash();
  if (tab === 'maq') renderMaq();
  updateCloudInd();
}
$('#cloudInd').onclick = () => goTab('maq');
$('#verBadge').onclick = openVersionSheet;
render();

/* app montado: tira o splash (com um mínimo de tela para não piscar) */
setTimeout(() => {
  const s = $('#splash');
  if (!s) return;
  s.classList.add('hide');
  s.addEventListener('transitionend', () => s.remove(), { once: true });
  setTimeout(() => s.remove(), 800);   /* caso a transição não dispare */
}, 700);
</script>
