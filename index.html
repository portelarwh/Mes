  $('#fReal').oninput = upd;
  upd();
  $('#fBack').onclick = closeSheet;
  $('#fSave').onclick = () => {
    const real = Math.max(0, +$('#fReal').value || 0);
    const scrap = Math.min(real, Math.max(0, +$('#fScrap').value || 0));
    const now = Date.now();
    const segs = segsOf(a, now);
    db.sessions.push({
      id: a.id, machineId: a.machineId, start: a.start, end: now,
      segs, theo: theoOf(a, m, now), real, scrap,
      ...(a.manual ? { manual: true } : {}),
    });
    db.active = null; save(); closeSheet();
    goTab('dash');
  };
}

/* ---------- tick de 1s: cronômetros ao vivo ---------- */
setInterval(tick, 1000);
function tick() {
  const a = db.active;
  if (!a || tab !== 'apontar') return;
  const m = machineById(a.machineId);
  const t = totals(a);
  const elT = $('#tTotal'); if (elT) elT.textContent = fmtDur(t.total);
  const elS = $('#tState');
  if (elS && a.current) elS.textContent = fmtDur(Date.now() - a.current.start);
  const csd = $('#curSegDur');
  if (csd && a.current) csd.textContent = fmtDur(Date.now() - a.current.start);
  const sh = $('#stdHint');
  if (sh && a.current && a.current.stdMs) {
    const rem = a.current.stdMs - (Date.now() - a.current.start);
    sh.innerHTML = rem >= 0
      ? `⏱ Tempo padrão ${fmtDurLong(a.current.stdMs)} — resta <b>${fmtDur(rem)}</b> dentro do planejado`
      : `⚠️ <b style="color:var(--bad)">Estourou o tempo padrão em ${fmtDur(-rem)}</b> — o excedente conta como não planejado`;
  }
  const theo = theoOf(a, m);
  const elTh = $('#theoV'); if (elTh) elTh.innerHTML = fmtInt(theo) + ' <small>pçs</small>';

  /* tempo somado por estado, embaixo de cada botão */
  STATE_ORDER.forEach(k => { const e = $('#acc-' + k); if (e) e.textContent = fmtDur(t[k]); });

  /* média real, microparadas e OEE parcial (real × máquina) a partir da produção parcial */
  const pr = a.partialReal, ps = Math.min(a.partialScrap || 0, pr || 0);
  const o = oeeOf({ t, theo, real: pr || 0, scrap: ps, nFinished: pr > 0 ? 1 : 0 }, { real: pr != null ? pr : undefined, scrap: ps });
  const set = (id, html) => { const e = $(id); if (e) e.innerHTML = html; };
  if (pr > 0) {
    const avg = t.prod > 0 ? pr / (t.prod / 60000) : 0;
    set('#avgV', fmtInt(avg) + ' <small>pçs/min</small>');
    set('#microV', o.microMs != null ? `<span style="color:var(--bad)">${fmtDur(o.microMs)}</span>` : '—');
    set('#oeeRealV', o.oee != null ? pct(o.oee) : '—');
    set('#oeeMachV', o.oeeM != null ? pct(o.oeeM) : '—');
    const hint = $('#prodHint');
    if (hint) hint.innerHTML = `Para ${fmtInt(pr)} pçs a ${fmtInt(m ? m.rate : 0)} pçs/min bastariam <b>${fmtDur(o.effMs)}</b> — os outros <b class="diff-neg">${fmtDur(o.microMs)}</b> de tempo produzindo viraram microparadas ou ritmo reduzido.`;
  } else {
    set('#avgV', '— <small>pçs/min</small>'); set('#microV', '—');
    set('#oeeRealV', '—'); set('#oeeMachV', '—');
  }

  const list = $('#timeList');
  if (list) {
    const c = calcCfg();
    const off = k => (k === 'idle' && !c.idleCountsAsStop) || (k === 'wait' && !c.waitCountsAsStop);
    list.innerHTML = STATE_ORDER.map(k => `
      <div class="time-row"><span class="sw" style="background:${STATES[k].color}"></span>
        <span class="nm">${STATES[k].label}${off(k) ? ' <span class="badge planned">fora do OEE da máquina</span>' : ''}</span>
        <span class="tv">${fmtDur(t[k])}</span></div>`).join('') +
      `<div class="time-row" style="border-top:1px solid var(--grid);padding-top:8px">
        <span class="sw" style="background:transparent"></span><span class="nm"><b>Total</b></span><span class="tv">${fmtDur(t.total)}</span></div>`;
  }
}

/* =====================================================
   MANUAL — OEE a partir de dados digitados
   ===================================================== */
/* tolerância: abaixo disso o saldo é considerado zerado (~0,3s) */
const MIN_EPS = 0.005;
/* minutos decimais → "1h 05min" / "12min 30s" / "18s" */
function fmtMinutes(n) {
  const neg = n < -0.0001;
  let sec = Math.round(Math.abs(n) * 60);
  const h = Math.floor(sec / 3600); sec -= h * 3600;
  const mi = Math.floor(sec / 60), s = sec - mi * 60;
  const txt = h > 0 ? `${h}h ${String(mi).padStart(2, '0')}min`
    : mi > 0 ? (s > 0 ? `${mi}min ${String(s).padStart(2, '0')}s` : `${mi}min`)
    : `${s}s`;
  return (neg ? '−' : '') + txt;
}

const fmtSec = s => fmtMinutes((s || 0) / 60);
/* segundos → "5:30" (mm:ss) ou "1:05:30" (h:mm:ss) */
function fmtClock(sec) {
  sec = Math.round(Math.max(0, sec));
  const h = Math.floor(sec / 3600), mi = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(mi).padStart(2, '0')}:${String(s).padStart(2, '0')}`
               : `${mi}:${String(s).padStart(2, '0')}`;
}
/* texto livre → segundos. Entende 330 · 5:30 · 1:05:30 · 5min · 5m30s · 2h
   `unit` é como interpretar um número solto: 's' (padrão) ou 'min'.        */
function parseDur(str, unit) {
  const t = String(str == null ? '' : str).trim().toLowerCase().replace(',', '.');
  if (!t) return null;
  if (t.includes(':')) {                                   /* mm:ss ou h:mm:ss */
    const p = t.split(':').map(x => parseFloat(x) || 0);
    if (p.some(x => !isFinite(x))) return null;
    return p.length >= 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
  }
  if (/[hms]/.test(t)) {                                   /* 2h 5min 30s */
    const g = (re) => { const m = t.match(re); return m ? parseFloat(m[1]) : 0; };
    const sec = g(/(\d+(?:\.\d+)?)\s*h/) * 3600 + g(/(\d+(?:\.\d+)?)\s*m(?!s)/) * 60 + g(/(\d+(?:\.\d+)?)\s*s/);
    return sec > 0 ? sec : null;
  }
  const n = parseFloat(t);
  if (!isFinite(n)) return null;
  return unit === 'min' ? n * 60 : n;
}

/* campos de ineficiência apontáveis, na ordem em que aparecem na tela.
   Os valores são apontados em SEGUNDOS (paradas costumam durar segundos). */
const MANUAL_BUCKETS = [
  { key: 'stopS', id: 'inStop', label: 'Paradas',    color: 'var(--st-stop)' },
  { key: 'idleS', id: 'inIdle', label: 'Ociosidade', color: 'var(--st-idle)' },
  { key: 'waitS', id: 'inWait', label: 'Esperando',  color: 'var(--st-wait)' },
];
let manualRecalc = () => {};

function renderManual() {
  const el = $('#page-manual');
  const m = db.manual || {};
  /* migração: até a v2.1.0 paradas/ociosidade/espera eram digitadas em minutos */
  if (m.stopS === undefined && (m.stop != null || m.idle != null || m.wait != null)) {
    const cv = x => (x == null ? null : Math.round(x * 60));
    m.stopS = cv(m.stop); m.idleS = cv(m.idle); m.waitS = cv(m.wait);
    delete m.stop; delete m.idle; delete m.wait;
    db.manual = m; save();
  }
  const secField = (id, key, label) => `
    <div class="field" style="margin:0">
      <div class="field-head"><label for="${id}">${label}</label>
        <button class="mini-btn" data-calc="${key}" title="Calculadora de tempo — ${label}" aria-label="Calculadora de tempo — ${label}">🧮</button></div>
      <input id="${id}" type="text" inputmode="numeric" autocomplete="off" placeholder="em branco" value="${m[key] ?? ''}">
      <span class="echo" id="echo${id}"></span>
    </div>`;
  el.innerHTML = `
    <div class="card">
      <h2>1 · Período e produção</h2>
      <p class="hint" style="margin-bottom:12px">Informe o <b>tempo de produção</b> (a janela em que a máquina esteve à disposição) e a <b>produção total</b>. O app separa quanto disso foi <b>máquina útil</b> e quanto foi <b>ineficiência</b>.</p>
      <div class="field"><label for="inMach">Máquina (usa a capacidade cadastrada e permite salvar)</label>
        <select id="inMach"><option value="">— sem máquina —</option>
          ${db.machines.map(x => `<option value="${x.id}" ${m.machineId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select></div>
      <div class="kpi-row" style="margin-bottom:12px">
        <div class="field" style="margin:0"><label for="inRate">Capacidade nominal (pçs/min)</label>
          <input id="inRate" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Ex.: 10" value="${m.rate ?? ''}"></div>
        <div class="field" style="margin:0"><label for="inTotal">Tempo de produção (min)</label>
          <input id="inTotal" type="number" inputmode="decimal" min="1" step="any" placeholder="Ex.: 60" value="${m.total ?? ''}"></div>
      </div>
      <div class="kpi-row">
        <div class="field" style="margin:0"><label for="inReal">Produção total (pçs)</label>
          <input id="inReal" type="number" inputmode="numeric" min="0" placeholder="Ex.: 400" value="${m.real ?? ''}"></div>
        <div class="field" style="margin:0"><label for="inScrap">Refugo (pçs)</label>
          <input id="inScrap" type="number" inputmode="numeric" min="0" placeholder="Ex.: 50" value="${m.scrap ?? ''}"></div>
      </div>
      <p class="hint" style="margin-top:10px">A <b>produção total</b> já inclui o refugo — a máquina trabalhou para fazer a peça ruim também, então esse tempo é máquina útil. O refugo volta a pesar só na Qualidade.</p>
    </div>

    <div class="card">
      <h2>2 · De onde veio a ineficiência</h2>
      <div id="balanceOut"></div>
      <p class="hint" style="margin:14px 0 8px">Aponte em <b>segundos</b>. Também aceita <b>mm:ss</b> (5:30) ou <b>5min</b> — e o 🧮 soma várias paradas para você.</p>
      <div class="kpi-row" style="margin-bottom:12px">
        ${secField('inStop', 'stopS', 'Paradas (s)')}
        ${secField('inIdle', 'idleS', 'Ociosidade (s)')}
      </div>
      <div class="kpi-row">
        ${secField('inWait', 'waitS', 'Esperando linha (s)')}
        <div class="field" style="margin:0">
          <div class="field-head"><label for="inMicro">Micro paradas (s) · saldo</label></div>
          <input id="inMicro" type="text" readonly tabindex="-1" placeholder="—">
          <span class="echo" id="echoinMicro"></span>
        </div>
      </div>
      <div id="suggestOut" style="margin-top:14px"></div>
    </div>
    <div id="manualOut"></div>`;

  const ids = ['inRate', 'inTotal', 'inStop', 'inIdle', 'inWait', 'inReal', 'inScrap'];
  const numOf = id => { const n = parseFloat($('#' + id).value); return isFinite(n) ? n : null; };
  const secOf = id => { const s = parseDur($('#' + id).value, 's'); return s == null ? null : Math.max(0, s); };
  const readInputs = () => ({
    machineId: $('#inMach').value || null,
    rate: numOf('inRate'),
    total: numOf('inTotal'),
    stopS: secOf('inStop'),   /* null = campo em branco (≠ zero apontado) */
    idleS: secOf('inIdle'),
    waitS: secOf('inWait'),
    real: numOf('inReal'),
    scrap: numOf('inScrap'),
  });
  manualRecalc = () => {
    db.manual = readInputs(); save();
    MANUAL_BUCKETS.forEach(b => {
      const raw = $('#' + b.id).value.trim(), sec = db.manual[b.key];
      $('#echo' + b.id).innerHTML = !raw ? '' : sec == null ? '<span style="color:var(--bad)">não entendi o valor</span>'
        : `= <b>${fmtSec(sec)}</b>${/[:hms]/i.test(raw) ? ` · ${fmtInt(sec)} s` : ''}`;
    });
    calcManual(db.manual);
  };
  ids.forEach(id => $('#' + id).oninput = manualRecalc);
  el.querySelectorAll('[data-calc]').forEach(b => b.onclick = () => openCalcSheet(b.dataset.calc));
  $('#inMach').onchange = () => {
    const mm = machineById($('#inMach').value);
    if (mm) $('#inRate').value = mm.rate;
    manualRecalc();
  };
  manualRecalc();
}

/* joga `addSec` segundos no campo `id` (somando ao que já estiver lá) */
function manualAdd(id, addSec) {
  const el = $('#' + id); if (!el) return;
  const cur = parseDur(el.value, 's') || 0;
  el.value = Math.max(0, Math.round(cur + addSec));
  manualRecalc();
}

/* =====================================================
   Calculadora de tempo — soma paradas em mm:ss
   ===================================================== */
let calcParts = [];
function openCalcSheet(key) {
  const b = MANUAL_BUCKETS.find(x => x.key === key);
  calcParts = [];
  openSheet(`
    <h3>🧮 Somar tempo — ${b.label}</h3>
    <p class="hint">Digite a duração de cada parada e quantas vezes ela aconteceu. No campo de minutos você pode escrever direto <b>5:30</b> (5min 30s).</p>
    <div class="calc-row">
      <div class="field"><label for="cMin">Minutos</label>
        <input id="cMin" type="text" inputmode="numeric" autocomplete="off" placeholder="5 ou 5:30"></div>
      <div class="field"><label for="cSec">Segundos</label>
        <input id="cSec" type="number" inputmode="numeric" min="0" step="any" placeholder="30"></div>
      <div class="field"><label for="cQty">Vezes</label>
        <input id="cQty" type="number" inputmode="numeric" min="1" step="1" placeholder="1"></div>
      <button class="calc-add" id="cAdd" title="Adicionar" aria-label="Adicionar">＋</button>
    </div>
    <div class="pick-grid" id="cQuick">
      ${[15, 30, 60, 120, 300, 600].map(s => `<button class="pick" data-q="${s}">+ ${fmtSec(s)}</button>`).join('')}
    </div>
    <div id="cBody"></div>`);

  const bodyEl = $('#cBody');
  const total = () => calcParts.reduce((a, p) => a + p.sec * p.qty, 0);

  const draw = () => {
    const tot = total();
    bodyEl.innerHTML = `
      ${calcParts.length ? `<div class="calc-list">${calcParts.map((p, i) => `
        <div class="calc-item"><span class="nm">${fmtClock(p.sec)}${p.qty > 1 ? ` × ${p.qty}` : ''}</span>
          <span class="tv">${fmtInt(p.sec * p.qty)} s</span>
          <button data-del="${i}" aria-label="Remover">✕</button></div>`).join('')}</div>`
        : '<p class="hint">Nenhuma parada somada ainda.</p>'}
      <div class="calc-total" style="margin-top:12px"><span class="k">TOTAL</span>
        <span class="v">${fmtInt(tot)} s<small>${fmtSec(tot)} · ${fmtClock(tot)}</small></span></div>
      <button class="btn" id="cApply" ${tot > 0 ? '' : 'disabled style="opacity:.5"'}>↳ Somar em ${b.label} (+${fmtInt(tot)} s)</button>
      <button class="btn ghost" id="cSet" ${tot > 0 ? '' : 'disabled style="opacity:.5"'}>Substituir: ${b.label} = ${fmtInt(tot)} s</button>
      <button class="btn ghost" id="cClose">Fechar</button>`;
    bodyEl.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { calcParts.splice(+x.dataset.del, 1); draw(); });
    $('#cApply').onclick = () => { if (total() > 0) { manualAdd(b.id, total()); closeSheet(); } };
    $('#cSet').onclick = () => { if (total() > 0) { $('#' + b.id).value = Math.round(total()); manualRecalc(); closeSheet(); } };
    $('#cClose').onclick = closeSheet;
  };

  const add = sec => {
    if (!(sec > 0)) return;
    const qty = Math.max(1, Math.round(parseFloat($('#cQty').value) || 1));
    calcParts.push({ sec: Math.round(sec), qty });
    $('#cMin').value = ''; $('#cSec').value = ''; $('#cQty').value = '';
    draw();
    $('#cMin').focus();
  };
  $('#cAdd').onclick = () => add((parseDur($('#cMin').value, 'min') || 0) + (parseDur($('#cSec').value, 's') || 0));
  $('#cMin').onkeydown = $('#cSec').onkeydown = $('#cQty').onkeydown = e => { if (e.key === 'Enter') $('#cAdd').click(); };
  $('#cQuick').querySelectorAll('[data-q]').forEach(x => x.onclick = () => add(+x.dataset.q));
  draw();
  $('#cMin').focus();
}

function calcManual(v) {
  const bal = $('#balanceOut'), sug = $('#suggestOut'), micEl = $('#inMicro'), out = $('#manualOut');
  if (!out) return;

  const rate = v.rate, total = v.total, real = v.real;
  if (!(rate > 0 && total > 0 && real != null && real >= 0)) {
    if (bal) bal.innerHTML = '<p class="hint">Preencha <b>capacidade nominal</b>, <b>tempo de produção</b> e <b>produção total</b> — o app calcula na hora o tempo de máquina útil e o tempo de ineficiência.</p>';
    if (sug) sug.innerHTML = '';
    if (micEl) { micEl.value = ''; $('#echoinMicro').innerHTML = ''; }
    out.innerHTML = '<div class="card"><p class="hint">Aguardando os dados do período para calcular o OEE.</p></div>';
    return;
  }

  /* ---- núcleo do raciocínio ---------------------------------------------
     tempo de produção (janela) = máquina útil + ineficiência
     máquina útil  = produção total ÷ capacidade nominal   (refugo incluso!)
     ineficiência  = paradas + ociosidade + espera + micro paradas          */
  const scrap    = Math.min(Math.max(0, v.scrap || 0), real);
  const good     = real - scrap;
  const util     = real / rate;             /* tempo de máquina útil */
  const utilGood = good / rate;
  const utilScrap = util - utilGood;
  const ineff    = total - util;            /* tempo de ineficiência */

  /* os buckets são apontados em segundos; aqui tudo vira minuto */
  const val   = k => (v[k] == null ? 0 : Math.max(0, v[k]) / 60);
  const blank = k => v[k] == null;
  const declared = MANUAL_BUCKETS.reduce((a, b) => a + val(b.key), 0);
  const micro    = ineff - declared;        /* saldo → micro paradas */
  const microPos = Math.max(0, micro);
  const microSec = Math.round(microPos * 60);
  const oper     = total - declared;        /* tempo rodando = útil + micro */

  const microOk = ineff >= -MIN_EPS && micro >= -MIN_EPS;
  if (micEl) {
    micEl.value = microOk ? fmtInt(microSec) : '—';
    $('#echoinMicro').innerHTML = microOk ? `= <b>${fmtSec(microSec)}</b>` : '';
  }

  /* ---- cascata: janela → útil → ineficiência ---- */
  bal.innerHTML = `
    <div class="wf">
      <div class="wf-row"><span class="op"></span>
        <span class="nm">Tempo de produção<span class="sub">janela apontada</span></span>
        <span class="tv">${fmtMinutes(total)}</span></div>
      <div class="wf-row"><span class="op">−</span>
        <span class="nm">Tempo de máquina útil<span class="sub">${fmtInt(real)} pçs ÷ ${rate} pçs/min${scrap > 0 ? ` · ${fmtMinutes(utilScrap)} foram para o refugo` : ''}</span></span>
        <span class="tv">${fmtMinutes(util)}</span></div>
      <div class="wf-row tot${ineff < -MIN_EPS ? ' neg' : ''}"><span class="op">=</span>
        <span class="nm">Tempo de ineficiência<span class="sub">${ineff < -MIN_EPS
          ? 'negativo: a produção informada não cabe na janela'
          : `${pct(total > 0 ? ineff / total : 0, 1)} da janela · distribua abaixo`}</span></span>
        <span class="tv">${fmtMinutes(ineff)}</span></div>
    </div>`;

  /* ---- erros que impedem a distribuição ---- */
  if (ineff < -MIN_EPS) {
    sug.innerHTML = `<div class="callout warn"><div>⚠️ <b>${fmtInt(real)} pçs</b> a ${rate} pçs/min exigem <b>${fmtMinutes(util)}</b> de máquina, mais que os ${fmtMinutes(total)} da janela. Não há ineficiência para distribuir — confira a <b>capacidade nominal</b> (provavelmente está subestimada) ou o tempo de produção.</div></div>`;
    out.innerHTML = `<div class="card"><p class="hint">Corrija os dados acima para ver o OEE.</p></div>`;
    return;
  }
  if (declared > total + MIN_EPS) {
    sug.innerHTML = `<div class="callout warn"><div>⚠️ Paradas + ociosidade + espera somam <b>${fmtMinutes(declared)}</b> e passam do tempo de produção (${fmtMinutes(total)}).</div></div>`;
    out.innerHTML = `<div class="card"><p class="hint">Corrija os apontamentos acima para ver o OEE.</p></div>`;
    return;
  }

  /* ---- ledger da dedução + sugestão do saldo ---- */
  const ledger = MANUAL_BUCKETS.filter(b => !blank(b.key) || val(b.key) > 0).map(b =>
    `<div class="wf-row"><span class="op">−</span>
       <span class="nm"><span class="sw" style="background:${b.color};display:inline-block;vertical-align:middle;margin-right:7px"></span>${b.label}<span class="sub">${fmtInt(v[b.key] || 0)} s</span></span>
       <span class="tv">${fmtMinutes(val(b.key))}</span></div>`).join('');
  const blanks = MANUAL_BUCKETS.filter(b => blank(b.key));

  let saldoNote, callout = '';
  if (micro < -MIN_EPS) {
    saldoNote = 'apontado a mais do que a ineficiência';
    callout = `<div class="callout warn"><div>⚠️ Você apontou <b>${fmtMinutes(-micro)}</b> a mais do que a ineficiência do período. Só sobrariam ${fmtMinutes(oper)} rodando para fazer ${fmtInt(real)} pçs, que exigem ${fmtMinutes(util)}. Reduza os apontamentos ou revise a capacidade nominal.</div></div>`;
  } else if (micro <= MIN_EPS) {
    saldoNote = 'ineficiência 100% apontada';
    callout = `<div class="callout ok"><div>✓ Toda a ineficiência do período está explicada por paradas, ociosidade e espera. Sem saldo para micro paradas.</div></div>`;
  } else {
    saldoNote = 'o que sobrou da ineficiência';
    const saldo = `<b>${fmtMinutes(micro)}</b> (${fmtInt(microSec)} s)`;
    const acts = arr => `<div class="acts">${arr.join('')}</div>`;
    const btn = (id, label) => `<button class="pick" data-add="${id}">↳ ${label} +${fmtInt(microSec)} s</button>`;
    if (blanks.length === 1) {
      const b = blanks[0];
      callout = `<div class="callout"><div>Sobram ${saldo} sem apontamento. <b>${b.label}</b> é o único campo em branco — foi tudo para lá?</div>
        ${acts([btn(b.id, `Jogar tudo em ${b.label}`), `<button class="pick" data-micro="1">Não, é micro parada</button>`])}</div>`;
    } else if (blanks.length > 1) {
      callout = `<div class="callout"><div>Sobram ${saldo} sem apontamento e ${blanks.length} campos continuam em branco (${blanks.map(b => b.label.toLowerCase()).join(', ')}). Enquanto não forem preenchidos, o saldo conta como <b>micro paradas</b>.</div>
        ${acts(blanks.map(b => btn(b.id, b.label)).concat(`<button class="pick" data-micro="1">É micro parada</button>`))}</div>`;
    } else {
      callout = `<div class="callout"><div>Com tudo apontado, sobram ${saldo}: a máquina estava rodando, mas esse tempo não virou peça. É a conta de <b>micro paradas</b> — pequenas interrupções e ritmo reduzido que ninguém registra. Equivale a <b>${fmtInt(microPos * rate)} pçs</b> perdidas.</div></div>`;
    }
  }

  sug.innerHTML = `
    <div class="wf" style="margin-bottom:${callout ? '12px' : '0'}">
      <div class="wf-row"><span class="op"></span><span class="nm">Tempo de ineficiência</span><span class="tv">${fmtMinutes(ineff)}</span></div>
      ${ledger}
      <div class="wf-row tot${micro < -MIN_EPS ? ' neg' : ''}"><span class="op">=</span>
        <span class="nm"><span class="sw" style="background:#eb6834;display:inline-block;vertical-align:middle;margin-right:7px"></span>Micro paradas<span class="sub">${saldoNote}${micro >= -MIN_EPS ? ` · ${fmtInt(microSec)} s` : ''}</span></span>
        <span class="tv">${fmtMinutes(micro)}</span></div>
    </div>${callout}`;

  sug.querySelectorAll('[data-add]').forEach(b => b.onclick = () => manualAdd(b.dataset.add, Math.round(micro * 60)));
  const mb = sug.querySelector('[data-micro]');
  if (mb) mb.onclick = () => { blanks.forEach(b => { $('#' + b.id).value = 0; }); manualRecalc(); };

  if (micro < -MIN_EPS) { out.innerHTML = `<div class="card"><p class="hint">Ajuste os apontamentos para ver o OEE.</p></div>`; return; }

  /* ---- OEE --------------------------------------------------------------
     Disponibilidade = tempo rodando ÷ janela
     Performance     = máquina útil ÷ tempo rodando   (micro paradas pesam aqui)
     Qualidade       = peças boas ÷ produção total                            */
  const cfg = calcCfg();
  const outMin = (cfg.idleCountsAsStop ? 0 : val('idleS')) + (cfg.waitCountsAsStop ? 0 : val('waitS'));
  const baseMach = Math.max(0.0001, total - outMin);
  const A  = oper / total;
  const Am = oper / baseMach;
  const P  = oper > 0 ? Math.min(1, util / oper) : 0;
  const Q  = real > 0 ? good / real : 0;
  const oee  = A * P * Q;
  const oeeM = Am * P * Q;
  const theo = rate * oper;                 /* teórica no tempo rodando */

  const mm2 = machineById(v.machineId);
  const target = mm2 ? targetOf(mm2) : DEFAULT_OEE_TARGET;
  const okMeta = oee * 100 >= target;

  /* barra: para onde foi o tempo */
  const segsBar = [
    ['Máquina útil — peças boas', utilGood, 'var(--st-prod)'],
    ['Máquina útil — refugo', utilScrap, 'var(--muted)'],
    ['Micro paradas (saldo)', microPos, '#eb6834'],
    ['Paradas', val('stopS'), 'var(--st-stop)'],
    ['Ociosidade', val('idleS'), 'var(--st-idle)'],
    ['Esperando', val('waitS'), 'var(--st-wait)'],
  ].filter(s => s[1] > MIN_EPS);

  out.innerHTML = `
    <div class="card">
      <h2>3 · Resultado</h2>
      <div class="gauge-grid">
        <div class="gauge gauge-hero">${donutSVG(oeeM, 'OEE máquina', 'MÁQUINA', oeeM * 100 >= target ? 'var(--good)' : 'var(--bad)')}
          <span class="glabel">OEE da máquina</span>
          <span class="gmeta">meta ${target.toFixed(0)}% · ${oeeM * 100 >= target ? '✓ atingida' : 'abaixo'}</span></div>
        <div class="gauge gauge-hero">${donutSVG(oee, 'OEE real', 'REAL', okMeta ? 'var(--good)' : 'var(--bad)')}
          <span class="glabel">OEE real (linha)</span>
          <span class="gmeta">${outMin > MIN_EPS ? `inclui ${fmtMinutes(outMin)} de fora` : 'toda a janela'}</span></div>
        <div class="gauge">${donutSVG(Am, 'Disponibilidade da máquina')}<span class="glabel">Disp. máquina</span>
          <span class="gmeta">real ${pct(A, 0)}</span></div>
        <div class="gauge">${donutSVG(P, 'Performance')}<span class="glabel">Performance</span>
          <span class="gmeta">micro paradas</span></div>
        <div class="gauge">${donutSVG(Q, 'Qualidade')}<span class="glabel">Qualidade</span>
          <span class="gmeta">${scrap > 0 ? `${fmtInt(scrap)} refugo` : 'sem refugo'}</span></div>
      </div>
      <div class="kpi-row" style="margin-top:14px">
        <div class="kpi"><div class="k">MÁQUINA ÚTIL</div><div class="v">${fmtMinutes(util)}</div></div>
        <div class="kpi"><div class="k">INEFICIÊNCIA</div><div class="v">${fmtMinutes(ineff)}</div></div>
      </div>
      <p class="hint" style="margin-top:10px">O OEE de ${pct(oee, 1)} é exatamente <b>${fmtMinutes(utilGood)}</b> de máquina útil em peças boas dentro de <b>${fmtMinutes(total)}</b> de janela.</p>
    </div>
    <div class="card">
      <h2>Para onde foi o tempo (${fmtMinutes(total)})</h2>
      <div class="stackbar">${segsBar.map(s => `<div style="flex:${s[1]};background:${s[2]}" title="${s[0]}"></div>`).join('')}</div>
      <div style="height:12px"></div>
      <div class="time-list">
        ${segsBar.map(s => `<div class="time-row"><span class="sw" style="background:${s[2]}"></span>
          <span class="nm">${s[0]}</span><span class="tv">${fmtMinutes(s[1])}</span></div>`).join('')}
      </div>
      <p class="hint" style="margin-top:12px">
        Rodando ${fmtMinutes(oper)} × ${rate} pçs/min = <b>${fmtInt(theo)} pçs teóricas</b>; você entregou <b>${fmtInt(real)}</b>${scrap ? ` (${fmtInt(scrap)} de refugo)` : ''}.
        ${microPos > MIN_EPS
          ? `As <b>${fmtInt(theo - real)} pçs</b> que faltaram são as <b class="diff-neg">${fmtMinutes(microPos)}</b> de micro paradas — máquina ligada sem produzir na capacidade.`
          : 'A máquina rodou na capacidade nominal o tempo todo em que esteve ligada. 🎯'}
      </p>
    </div>
    <div class="card">
      <h2>Salvar</h2>
      ${v.machineId
        ? '<button class="btn" id="manualSave">💾 Salvar como apontamento no Dashboard</button><p class="hint" style="margin-top:8px">Entra no período atual com os tempos informados; as micro paradas ficam dentro do tempo de produção e aparecem como perda de performance.</p>'
        : '<p class="hint">Escolha uma máquina acima para poder salvar este cálculo como apontamento.</p>'}
    </div>`;

  const sv = $('#manualSave');
  if (sv) sv.onclick = () => {
    const now = Date.now();
    const min = 60000;
    const start = now - total * min;
    const segs = [];
    let t = start;
    const push = (state, dur) => { if (dur > 0) { segs.push({ state, reason: null, kind: null, planned: null, start: t, end: t + dur * min }); t += dur * min; } };
    push('prod', oper); push('stop', val('stopS')); push('idle', val('idleS')); push('wait', val('waitS'));
    db.sessions.push({ id: uid(), machineId: v.machineId, start, end: now, segs, theo, real, scrap, manual: true });
    save();
    goTab('dash');
  };
}

/* =====================================================
   DASHBOARD
   ===================================================== */
const PERIODS = { hoje: ['Hoje', 0], '7d': ['7 dias', 7], '30d': ['30 dias', 30], tudo: ['Tudo', null] };

function periodStart(key) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const days = PERIODS[key][1];
  if (days === null) return 0;
  if (days === 0) return d.getTime();
  return d.getTime() - (days - 1) * 86400000;
}

function donutSVG(value, label, sub, color) {
  const r = 42, c = 2 * Math.PI * r;
  const v = Math.max(0, Math.min(1, value || 0));
  const shown = value == null ? '—' : (value * 100).toFixed(value >= 1 ? 0 : 1).replace('.', ',') + '%';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(label)}: ${shown}">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color || 'var(--accent)'}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${(v * c).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 50 50)"/>
    <text x="50" y="${sub ? 47 : 50}" text-anchor="middle" dominant-baseline="middle"
      font-size="${shown.length > 5 ? 17 : 20}" font-weight="800" fill="var(--ink)">${shown}</text>
    ${sub ? `<text x="50" y="64" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">${esc(sub)}</text>` : ''}
  </svg>`;
}
/* cor do gauge de OEE conforme a meta: verde ≥ meta, vermelho < meta */
function oeeColor(oee, targetPct) {
  if (oee == null || targetPct == null) return null;
  return oee * 100 >= targetPct ? 'var(--good)' : 'var(--bad)';
}
const targetOf = m => (m && m.oeeTarget > 0 ? m.oeeTarget : DEFAULT_OEE_TARGET);

function aggregate(sessions) {
  const agg = { t: { prod: 0, stop: 0, idle: 0, wait: 0, total: 0 }, theo: 0, real: 0, scrap: 0,
    reasons: {}, nFinished: 0,
    stopPlanned: 0, stopUnplanned: 0, stopExcess: 0,
    nStopPlanned: 0, nStopUnplanned: 0, nStopExcess: 0 };
  for (const s of sessions) {
    const t = totals(s);
    for (const k of ['prod','stop','idle','wait','total']) agg.t[k] += t[k];
    agg.theo += s.theo || theoOf(s, machineById(s.machineId));
    if (s.end !== undefined && s.real !== undefined) { agg.real += s.real; agg.scrap += s.scrap || 0; agg.nFinished++; }
    for (const seg of segsOf(s)) {
      if (seg.state === 'stop') {
        const r = seg.reason || 'Sem motivo';
        const dur = (seg.end || Date.now()) - seg.start;
        const planned = seg.planned != null ? seg.planned : reasonPlannedByName(seg.reason);
        const e = agg.reasons[r] || (agg.reasons[r] = { ms: 0, n: 0, plannedMs: 0, excessMs: 0 });
        e.ms += dur; e.n++;
        if (planned) {
          /* tempo padrão: o que passar dele conta como não planejado (variação operacional) */
          const std = seg.stdMs > 0 ? seg.stdMs : null;
          const pMs = std != null ? Math.min(dur, std) : dur;
          const xMs = dur - pMs;
          e.plannedMs += pMs; e.excessMs += xMs;
          agg.stopPlanned += pMs; agg.stopExcess += xMs; agg.nStopPlanned++;
          if (xMs > 0) agg.nStopExcess++;
        } else { agg.stopUnplanned += dur; agg.nStopUnplanned++; }
      }
    }
  }
  return agg;
}
/* MTBF / MTBB / MTTA / MTTR — sobre paradas classificadas como falha ou quebra */
function maintStats(sessions) {
  let opTime = 0, nFail = 0, nBreak = 0;
  const ttaList = [], ttrList = [];
  for (const s of sessions) {
    opTime += totals(s).prod;
    for (const seg of segsOf(s)) {
      if (seg.state !== 'stop' || !seg.kind || seg.kind === 'op') continue;
      const end = seg.end || Date.now();
      nFail++;                              // MTBF: toda falha (inclui quebras)
      if (seg.kind === 'break') nBreak++;   // MTBB: só quebras físicas
      if (seg.maintAt) {
        ttaList.push(seg.maintAt - seg.start);
        ttrList.push(end - seg.maintAt);
      } else {
        ttrList.push(end - seg.start);      // sem registro de chegada: reparo = parada inteira
      }
    }
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {
    nFail, nBreak,
    mtbf: nFail > 0 ? opTime / nFail : null,
    mtbb: nBreak > 0 ? opTime / nBreak : null,
    mtta: avg(ttaList),
    mttr: avg(ttrList),
  };
}

/* Dois OEEs:
   · real (linha)  — toda a janela medida entra na base: paradas, ociosidade e espera;
   · máquina       — tira da base o que não é responsabilidade da máquina (ociosidade
                     e/ou espera, conforme a configuração de cálculo).
   P e Q são iguais nos dois; muda só a Disponibilidade. */
function calcCfg() { return db.calc || (db.calc = { idleCountsAsStop: false, waitCountsAsStop: false }); }
function excludedMs(t) {
  const c = calcCfg();
  return (c.idleCountsAsStop ? 0 : t.idle) + (c.waitCountsAsStop ? 0 : t.wait);
}
function oeeOf(agg, opts) {
  const t = agg.t;
  const o = opts || {};
  const real = o.real != null ? o.real : agg.real;
  const scrap = o.scrap != null ? o.scrap : agg.scrap;
  const has = o.real != null ? real > 0 : agg.nFinished > 0;
  const excl = excludedMs(t);
  const baseMach = Math.max(0, t.total - excl);
  const A = t.total > 0 ? t.prod / t.total : null;
  const Am = baseMach > 0 ? t.prod / baseMach : null;
  const P = has && agg.theo > 0 ? real / agg.theo : null;
  const Q = has && real > 0 ? (real - scrap) / real : null;
  const mul = (a) => (a !== null && P !== null && Q !== null) ? a * P * Q : null;
  /* microparadas: tempo produzindo que não virou peça (tempo efetivo = produzindo × P) */
  const effMs = P !== null ? Math.min(t.prod, t.prod * P) : null;
  const microMs = P !== null ? Math.max(0, t.prod - effMs) : null;
  return { A, Am, P, Q, oee: mul(A), oeeM: mul(Am), baseMach, excl, effMs, microMs };
}

function renderDash() {
  const el = $('#page-dash');
  const from = periodStart(db.period);
  const done = db.sessions.filter(s => s.end >= from);
  const all = db.active ? [...done, db.active] : done;

  const chips = `<div class="chips wide">${Object.keys(PERIODS).map(k =>
    `<button class="${db.period === k ? 'active' : ''}" data-p="${k}">${PERIODS[k][0]}</button>`).join('')}</div>`;

  if (all.length === 0) {
    el.innerHTML = chips + `<div class="card"><div class="empty"><div class="big">◔</div>
      Sem apontamentos no período.<br>Faça uma medição na aba <b>Apontar</b>.</div></div>`;
    bindChips(el); return;
  }

  const agg = aggregate(all);
  const { A, Am, P, Q, oee, oeeM, excl, effMs, microMs } = oeeOf(agg);

  /* barra empilhada de tempos */
  const tt = agg.t.total || 1;
  const stack = STATE_ORDER.map(k =>
    `<div style="flex:${Math.max(agg.t[k] / tt, 0)};background:${STATES[k].color}" title="${STATES[k].label}: ${fmtDurLong(agg.t[k])}"></div>`).join('');
  const legend = STATE_ORDER.map(k => `
    <div class="time-row"><span class="sw" style="background:${STATES[k].color}"></span>
      <span class="nm">${STATES[k].label}</span>
      <span class="tv">${fmtDurLong(agg.t[k])} · ${pct(agg.t[k] / tt, 0)}</span></div>`).join('');

  /* paradas por motivo (barras ordenadas, % acumulado como rótulo) */
  const reasons = Object.entries(agg.reasons).sort((a, b) => b[1].ms - a[1].ms);
  const stopTotal = reasons.reduce((s, r) => s + r[1].ms, 0) || 1;
  let cum = 0;
  const bars = reasons.map(([r, e]) => {
    cum += e.ms;
    const planned = e.plannedMs + e.excessMs >= e.ms / 2;
    /* barra bicolor quando a parada planejada estourou o tempo padrão */
    const pFrac = e.ms > 0 ? (e.plannedMs / e.ms * 100).toFixed(1) : 0;
    const fillBg = planned
      ? (e.excessMs > 0 ? `background:linear-gradient(90deg, var(--accent) ${pFrac}%, var(--bad) ${pFrac}%)` : 'background:var(--accent)')
      : '';
    return `<div class="hbar">
      <div class="top"><span class="n">${esc(r)} ${plannedBadge(planned)}</span>
        <span class="v">${fmtDurLong(e.ms)} · ${pct(e.ms / stopTotal, 0)} <span style="color:var(--muted)">(acum. ${pct(cum / stopTotal, 0)})</span></span></div>
      <div class="track"><div class="fill" style="width:${(e.ms / reasons[0][1].ms * 100).toFixed(1)}%;${fillBg}"></div></div>
      ${e.excessMs > 0 ? `<div class="top" style="margin-top:2px"><span class="n" style="font-size:11px">└ estouro do tempo padrão</span><span class="v" style="font-size:11px;color:var(--bad)">+${fmtDurLong(e.excessMs)}</span></div>` : ''}
    </div>`;
  }).join('');
  const unplannedTotal = agg.stopUnplanned + agg.stopExcess;
  const plannedSplit = agg.t.stop > 0 ? `
    <div class="kpi-row" style="margin-bottom:12px">
      <div class="kpi"><div class="k">Não planejadas</div><div class="v" style="color:var(--bad)">${fmtDurLong(unplannedTotal)}</div><div class="k">${agg.nStopUnplanned} evento(s)${agg.stopExcess > 0 ? ' + estouros' : ''}</div></div>
      <div class="kpi"><div class="k">Planejadas (no padrão)</div><div class="v" style="color:var(--accent)">${fmtDurLong(agg.stopPlanned)}</div><div class="k">${agg.nStopPlanned} evento(s)</div></div>
    </div>
    ${agg.stopExcess > 0 ? `<p class="hint" style="margin-bottom:12px">⚠️ <b>${fmtDurLong(agg.stopExcess)}</b> de estouro sobre o tempo padrão em ${agg.nStopExcess} parada(s) planejada(s) — variação operacional, contabilizada como não planejada.</p>` : ''}` : '';

  /* por máquina */
  const machines = db.machines.filter(m => all.some(s => s.machineId === m.id));
  const perMachine = machines.map(m => {
    const ms = all.filter(s => s.machineId === m.id);
    const ag = aggregate(ms);
    const o = oeeOf(ag);
    const live = db.active && db.active.machineId === m.id;
    const shown = o.oeeM !== null ? o.oeeM : o.Am;
    return `<div class="mrow">
      ${donutSVG(shown, 'OEE máquina ' + m.name, o.oeeM !== null ? 'MÁQ.' : 'DISP',
        o.oeeM !== null ? oeeColor(o.oeeM, targetOf(m)) : null)}
      <div class="info">
        <div class="nm">${esc(m.name)}${live ? ' <span style="color:var(--good);font-size:11px">● ao vivo</span>' : ''}</div>
        <div class="sub">${esc(m.sector || '')} · meta ${targetOf(m)}% · OEE real ${o.oee !== null ? pct(o.oee) : '—'} · ${fmtInt(ag.real)} pçs · ${fmtInt(ag.scrap)} refugo</div>
        <div class="mini">
          <span>Produzindo <b>${fmtDurLong(ag.t.prod)}</b></span><span>Parada <b>${fmtDurLong(ag.t.stop)}</b></span>
          <span>Ociosa <b>${fmtDurLong(ag.t.idle)}</b></span><span>Esperando <b>${fmtDurLong(ag.t.wait)}</b></span>
          <span>Microparadas <b>${o.microMs != null ? fmtDurLong(o.microMs) : '—'}</b></span><span>Fora da base <b>${fmtDurLong(o.excl)}</b></span>
        </div>
      </div></div>`;
  }).join('');

  const avgMin = agg.t.prod > 0 ? agg.real / (agg.t.prod / 60000) : 0;
  const prodCard = agg.nFinished > 0 ? `
    <div class="card"><h2>Produção do período</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="k">Teórica</div><div class="v">${fmtInt(agg.theo)} <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Real</div><div class="v">${fmtInt(agg.real)} <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Diferença</div><div class="v ${agg.real - agg.theo >= 0 ? 'diff-pos' : 'diff-neg'}">${agg.real - agg.theo >= 0 ? '+' : ''}${fmtInt(agg.real - agg.theo)}</div></div>
        <div class="kpi"><div class="k">Refugo</div><div class="v">${fmtInt(agg.scrap)} <small>pçs</small></div></div>
        <div class="kpi"><div class="k">Média real</div><div class="v">${fmtInt(avgMin)} <small>pçs/min</small></div></div>
        <div class="kpi"><div class="k">Microparadas</div><div class="v diff-neg">${microMs != null ? fmtDurLong(microMs) : '—'}</div><div class="k">dentro do tempo produzindo</div></div>
      </div>
      ${microMs != null ? `<p class="hint" style="margin-top:10px">Para ${fmtInt(agg.real)} pçs no ritmo nominal bastariam <b>${fmtDurLong(effMs)}</b> de produção; o restante do tempo produzindo (<b class="diff-neg">${fmtDurLong(microMs)}</b>) foi microparada ou ritmo reduzido.</p>` : ''}
    </div>` : '';

  /* meta de OEE do período: média das metas das máquinas com dados */
  const targets = machines.map(targetOf);
  const target = targets.length ? targets.reduce((a, b) => a + b, 0) / targets.length : DEFAULT_OEE_TARGET;

  /* indicadores de manutenção */
  const ms = maintStats(all);
  const fmtM = v => v === null ? '—' : fmtDurLong(v);
  const maintCard = `
    <div class="card"><h2>Manutenção</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="k">MTBF · entre falhas <span class="diff-pos">↑</span></div>
          <div class="v">${fmtM(ms.mtbf)}</div><div class="k">${ms.nFail} falha(s)</div></div>
        <div class="kpi"><div class="k">MTBB · entre quebras <span class="diff-pos">↑</span></div>
          <div class="v">${fmtM(ms.mtbb)}</div><div class="k">${ms.nBreak} quebra(s)</div></div>
        <div class="kpi"><div class="k">MTTA · atendimento <span class="diff-neg">↓</span></div>
          <div class="v">${fmtM(ms.mtta)}</div><div class="k">chamado → chegada</div></div>
        <div class="kpi"><div class="k">MTTR · reparo <span class="diff-neg">↓</span></div>
          <div class="v">${fmtM(ms.mttr)}</div><div class="k">chegada → liberação</div></div>
      </div>
      <p class="hint" style="margin-top:10px">Classifique a parada como <b>Falha</b> ou <b>Quebra</b> e toque em “Manutenção chegou” durante a parada para alimentar MTTA e MTTR. Tempo operacional = tempo produzindo.</p>
    </div>`;

  const c = calcCfg();
  const outLabels = [!c.idleCountsAsStop ? 'ociosidade' : null, !c.waitCountsAsStop ? 'espera' : null].filter(Boolean);

  el.innerHTML = chips + `
    <button class="btn ghost wide" id="repBtn">📄 Relatório executivo — salvar PNG / PDF</button>
    <div class="card wide">
      <h2>Visão geral · ${PERIODS[db.period][0].toLowerCase()}</h2>
      <div class="gauge-grid">
        <div class="gauge gauge-hero">${donutSVG(oeeM, 'OEE máquina', 'MÁQUINA', oeeColor(oeeM, target))}
          <span class="glabel">OEE da máquina</span>
          <span class="gmeta">meta ${target.toFixed(0)}%${oeeM !== null ? (oeeM * 100 >= target ? ' · ✓ atingida' : ' · abaixo') : ''}</span></div>
        <div class="gauge gauge-hero">${donutSVG(oee, 'OEE real', 'REAL', oeeColor(oee, target))}
          <span class="glabel">OEE real (linha)</span>
          <span class="gmeta">${excl > 0 ? `inclui ${fmtDurLong(excl)} de ${outLabels.join(' e ')}` : 'toda a janela medida'}</span></div>
        <div class="gauge">${donutSVG(Am, 'Disponibilidade da máquina')}<span class="glabel">Disp. máquina</span>
          <span class="gmeta">real ${A !== null ? pct(A, 0) : '—'}</span></div>
        <div class="gauge">${donutSVG(P, 'Performance')}<span class="glabel">Performance</span>
          <span class="gmeta">${microMs != null ? fmtDurLong(microMs) + ' micro' : ''}</span></div>
        <div class="gauge">${donutSVG(Q, 'Qualidade')}<span class="glabel">Qualidade</span></div>
      </div>
      <p class="hint" style="margin-top:10px">${outLabels.length
        ? `<b>OEE da máquina</b> tira da base ${outLabels.join(' e ')} — a máquina não é penalizada pelo que veio de fora. <b>OEE real</b> mostra a perda da linha inteira. Ajuste em Máquinas → Cálculo do OEE.`
        : 'Ociosidade e espera estão contando como parada da máquina, então os dois OEEs coincidem. Ajuste em Máquinas → Cálculo do OEE.'}</p>
    </div>
    ${prodCard}
    ${maintCard}
    <div class="card">
      <h2>Distribuição do tempo</h2>
      <div class="stackbar">${stack}</div>
      <div style="height:12px"></div>
      <div class="time-list">${legend}
        <div class="time-row" style="border-top:1px solid var(--grid);padding-top:8px">
          <span class="sw" style="background:transparent"></span><span class="nm"><b>Total medido</b></span><span class="tv">${fmtDurLong(agg.t.total)}</span></div>
      </div>
    </div>
    <div class="card span2">
      <h2>Paradas — principais motivos</h2>
      ${plannedSplit}
      ${reasons.length ? `<div class="hbars">${bars}</div>` : '<p class="hint">Nenhuma parada apontada no período. 🎉</p>'}
    </div>
    <div class="card span2">
      <h2>Por máquina</h2>
      ${perMachine || '<p class="hint">Sem dados por máquina.</p>'}
    </div>
    <div class="card span2">
      <h2>Apontamentos (${done.length})</h2>
      ${done.slice().reverse().slice(0, 20).map(s => {
        const m = machineById(s.machineId); const t = totals(s);
        return `<div class="list-row"><div class="info">
          <div class="nm">${esc(m ? m.name : '?')} — ${fmtInt(s.real)} pçs <span style="color:var(--muted);font-weight:400">(teo ${fmtInt(s.theo)})</span></div>
          <div class="sub">${new Date(s.start).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${fmtDurLong(t.total)} · refugo ${fmtInt(s.scrap)}${s.manual ? ' · ✎ manual' : ''}</div>
        </div><div class="act"><button data-edit-sess="${s.id}">✎</button><button data-del-sess="${s.id}" style="color:var(--bad)">✕</button></div></div>`;
      }).join('') || '<p class="hint">Nenhum apontamento finalizado.</p>'}
      <p class="hint" style="margin-top:8px">Toque em ✎ para editar um apontamento fechado — corrigir marcações, produção e refugo, ou reabri-lo para voltar a medir.</p>
    </div>`;

  bindChips(el);
  $('#repBtn').onclick = openReport;
  el.querySelectorAll('[data-edit-sess]').forEach(b => b.onclick = () => openSessionEditSheet(b.dataset.editSess));
  el.querySelectorAll('[data-del-sess]').forEach(b => b.onclick = () => {
    openSheet(`<h3>Excluir este apontamento?</h3>
      <button class="btn danger" id="dsY">Sim, excluir</button><button class="btn ghost" id="dsN">Voltar</button>`);
    $('#dsY').onclick = () => { db.sessions = db.sessions.filter(s => s.id !== b.dataset.delSess); save(); closeSheet(); render(); };
    $('#dsN').onclick = closeSheet;
  });
}
function bindChips(el) {
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { db.period = b.dataset.p; save(); render(); });
}

/* =====================================================
   MÁQUINAS
   ===================================================== */
let editingId = null;
/* =====================================================
   NUVEM — indicador no topo e card de conta
   ===================================================== */
function updateCloudInd() {
  const el = $('#cloudInd'); if (!el) return;
  const ok = signedIn() && hasOrg();
  el.classList.toggle('on', ok);
  $('.tx', el).textContent = !cloudOn() ? 'sem nuvem'
    : !signedIn() ? 'nuvem' : ok ? auth.org.name : 'sem planta';
  el.title = ok ? `Conectado como ${auth.user.email} · planta ${auth.org.name}`
    : signedIn() ? 'Sua conta ainda não pertence a nenhuma planta'
    : 'Toque para entrar na sua conta';
}

function cloudMsg(txt, bad) {
  const el = $('#cloudMsg'); if (!el) return;
  el.innerHTML = !txt ? '' : bad
    ? `<span style="color:var(--bad)">⚠️ ${esc(txt)}</span>`
    : `<span style="color:var(--good)">✓ ${esc(txt)}</span>`;
}

/* executa uma ação de rede travando o botão e reportando o resultado */
function cloudRun(btn, fn, okTxt) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'aguarde…';
  cloudMsg('');
  Promise.resolve().then(fn).then(res => {
    renderCloudCard(); updateCloudInd();
    cloudMsg(typeof okTxt === 'function' ? okTxt(res) : okTxt);
  }).catch(e => {
    btn.disabled = false; btn.textContent = label;
    cloudMsg(e.message, true);
  });
}

function renderCloudCard() {
  const el = $('#cloudCard'); if (!el) return;
  const head = '<h2>Conta na nuvem</h2>';
  const msg = '<p class="hint" id="cloudMsg" style="margin-top:10px"></p>';

  if (!cloudOn()) {
    el.innerHTML = `${head}<p class="hint">Nenhum projeto Supabase configurado neste app. Os dados ficam só neste aparelho.</p>`;
    return;
  }

  /* ---- fora da conta ---- */
  if (!signedIn()) {
    el.innerHTML = `${head}
      <p class="hint" style="margin-bottom:12px">Entre para vincular este aparelho à sua planta. O app continua funcionando normalmente sem login — <b>por enquanto nada é enviado para a nuvem</b>.</p>
      <div class="field"><label for="cbMail">E-mail</label>
        <input id="cbMail" type="email" inputmode="email" autocomplete="username" placeholder="voce@empresa.com"></div>
      <div class="field"><label for="cbPass">Senha</label>
        <input id="cbPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn" id="cbIn">Entrar</button>
      <div style="height:8px"></div>
      <button class="btn ghost" id="cbUp">Criar conta</button>${msg}`;

    const creds = () => {
      const email = $('#cbMail').value.trim(), password = $('#cbPass').value;
      if (!email || !password) throw new Error('preencha e-mail e senha');
      return { email, password };
    };
    $('#cbIn').onclick = e => cloudRun(e.target, () => {
      const c = creds(); return cloudSignIn(c.email, c.password);
    }, 'conectado');
    $('#cbUp').onclick = e => cloudRun(e.target, () => {
      const c = creds(); return cloudSignUp(c.email, c.password);
    }, ok => ok ? 'conta criada' : 'conta criada — confirme o e-mail e volte para entrar');
    return;
  }

  /* ---- na conta, mas ainda sem planta ---- */
  if (!hasOrg()) {
    el.innerHTML = `${head}
      <p class="hint" style="margin-bottom:12px">Conectado como <b>${esc(auth.user.email || '')}</b>. Falta vincular esta conta a uma planta: crie a sua, ou entre numa existente com o código que o gestor passar.</p>
      <div class="field"><label for="cbOrg">Nome da planta</label>
        <input id="cbOrg" placeholder="Ex.: Unidade Guarulhos"></div>
      <button class="btn" id="cbNew">Criar planta</button>
      <div style="height:14px"></div>
      <div class="field"><label for="cbCode">Código de uma planta existente</label>
        <input id="cbCode" autocomplete="off" placeholder="Ex.: 3BA609F3" style="text-transform:uppercase"></div>
      <button class="btn ghost" id="cbJoin">Entrar na planta</button>
      <div style="height:14px"></div>
      <button class="btn ghost" id="cbOut">Sair da conta</button>${msg}`;

    $('#cbNew').onclick = e => cloudRun(e.target, () => {
      const n = $('#cbOrg').value.trim();
      if (!n) throw new Error('dê um nome à planta');
      return cloudCreateOrg(n);
    }, 'planta criada');
    $('#cbJoin').onclick = e => cloudRun(e.target, () => {
      const c = $('#cbCode').value.trim();
      if (!c) throw new Error('informe o código da planta');
      return cloudJoinOrg(c);
    }, 'você entrou na planta');
    $('#cbOut').onclick = e => cloudRun(e.target, cloudSignOut, 'sessão encerrada');
    return;
  }

  /* ---- conta e planta prontas ---- */
  el.innerHTML = `${head}
    <div class="list-row"><div class="info">
      <div class="nm">${esc(auth.org.name)}</div>
      <div class="sub">${esc(auth.user.email || '')} · ${esc(auth.org.role || 'operador')}</div></div></div>
    <div class="list-row"><div class="info">
      <div class="nm" style="font-variant-numeric:tabular-nums;letter-spacing:.08em">${esc(auth.org.joinCode || '—')}</div>
      <div class="sub">código para outro aparelho entrar nesta planta</div></div>
      <div class="act"><button id="cbCopy" title="Copiar código">⧉</button></div></div>
    <div style="height:12px"></div>
    <button class="btn ghost" id="cbPing">Testar conexão</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="cbOut">Sair da conta</button>
    <p class="hint" style="margin-top:12px">A conta está ligada, mas <b>os apontamentos ainda não sobem</b>: eles continuam só neste aparelho. O envio para a nuvem entra na próxima etapa.</p>${msg}`;

  $('#cbCopy').onclick = () => {
    const code = auth.org.joinCode || '';
    Promise.resolve()
      .then(() => navigator.clipboard.writeText(code))
      .then(() => cloudMsg('código copiado'))
      .catch(() => cloudMsg('copie à mão: ' + code, true));
  };
  $('#cbPing').onclick = e => cloudRun(e.target,
    () => Promise.all([sbCount('machines'), sbCount('sessions')]),
    r => `conexão ok — ${fmtInt(r[0])} máquina(s) e ${fmtInt(r[1])} apontamento(s) nesta planta`);
  $('#cbOut').onclick = e => cloudRun(e.target, cloudSignOut, 'sessão encerrada');
}

function renderMaq() {

  const editing = editingId ? machineById(editingId) : null;
  el.innerHTML = `
    <div class="card">
      <h2>${editing ? 'Editar máquina' : 'Cadastrar máquina'}</h2>
      <div class="field"><label for="mNome">Nome da máquina</label>
        <input id="mNome" placeholder="Ex.: Extrusora 01" value="${editing ? esc(editing.name) : ''}"></div>
      <div class="field"><label for="mSetor">Setor / grupo (opcional)</label>
        <input id="mSetor" placeholder="Ex.: Extrusão" value="${editing ? esc(editing.sector || '') : ''}"></div>
      <div class="field"><label for="mTaxa">Capacidade nominal (peças por minuto)</label>
        <input id="mTaxa" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Ex.: 100" value="${editing ? editing.rate : ''}"></div>
      <div class="field"><label for="mMeta">Meta de OEE (%)</label>
        <input id="mMeta" type="number" inputmode="decimal" min="1" max="100" step="any" placeholder="Ex.: ${DEFAULT_OEE_TARGET}" value="${editing && editing.oeeTarget ? editing.oeeTarget : ''}"></div>
      <button class="btn" id="mSave">${editing ? 'Salvar alterações' : '+ Cadastrar máquina'}</button>
      ${editing ? '<div style="height:8px"></div><button class="btn ghost" id="mCancelEdit">Cancelar edição</button>' : ''}
    </div>

    <div class="card">
      <h2>Máquinas cadastradas (${db.machines.length})</h2>
      ${db.machines.map(m => `
        <div class="list-row">
          <div class="info"><div class="nm">${esc(m.name)}</div>
            <div class="sub">${esc(m.sector || 'sem setor')} · ${fmtInt(m.rate)} pçs/min · meta OEE ${targetOf(m)}%</div></div>
          <div class="act">
            <button data-edit="${m.id}">✎</button>
            <button data-del="${m.id}" style="color:var(--bad)">✕</button>

    <div class="card">

      <p class="hint" style="margin-bottom:6px">Tipo, descrição e classificação (planejada ou não planejada) de cada motivo. Paradas planejadas não contam como falha/quebra.</p>
      ${db.reasons.map((r, i) => `
        <div class="list-row">
          <div class="info"><div class="nm">${esc(r.name)} ${plannedBadge(r.planned)}</div>
            <div class="sub">${esc(r.desc || 'sem descrição')}${r.planned && r.stdMin > 0 ? ` · tempo padrão ${r.stdMin}min` : ''}
              · <span style="color:var(--accent)">${esc(reasonScopeLabel(r))}</span></div></div>
          <div class="act"><button data-editr="${i}">✎</button><button data-delr="${i}" style="color:var(--bad)">✕</button></div>
        </div>`).join('')}
      <div style="height:12px"></div>
      <button class="btn ghost" id="rAdd">+ Novo motivo de parada</button>
    </div>

    <div class="card">
      <h2>Cálculo do OEE</h2>
      <p class="hint" style="margin-bottom:6px">Linha cíclica: escolha o que entra na conta da <b>máquina</b>. O <b>OEE real (linha)</b> sempre considera tudo; o <b>OEE da máquina</b> desconta da base o que você desmarcar aqui.</p>
      <div class="toggle-row">
        <input type="checkbox" id="cfgIdle" ${calcCfg().idleCountsAsStop ? 'checked' : ''}>
        <span><b>Ociosa (sem insumo)</b> conta como parada da máquina</span>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="cfgWait" ${calcCfg().waitCountsAsStop ? 'checked' : ''}>
        <span><b>Esperando</b> (máquina da frente não puxou) conta como parada da máquina</span>
      </div>
      <p class="hint" style="margin-top:10px">Desligado (padrão), esse tempo sai da base do OEE da máquina — ela não é penalizada por espera de outra máquina, mas o OEE real da linha continua mostrando a perda.</p>
    </div>

    <div class="card" id="installCard"></div>

    <div class="card" id="cloudCard"></div>

    <div class="card">
      <h2>Sobre</h2>
      <p class="hint">MES de apontamento manual — versão <b>v${APP_VERSION}</b>, publicada em ${fmtDateBR(APP_RELEASE_DATE)}. Toque no número da versão no topo para ver quando foi a última verificação e buscar atualização na hora. O app se atualiza sozinho quando há versão nova no servidor.</p>
      <p class="hint" style="margin-top:8px">Os dados ficam salvos neste aparelho (localStorage) e o app abre offline. A tela permanece acesa enquanto estiver aberto (indicador “tela” no topo).</p>

    if (!(rate > 0)) { $('#mTaxa').focus(); return; }
    if (!(meta > 0 && meta <= 100)) meta = DEFAULT_OEE_TARGET;
    if (editing) { editing.name = name; editing.sector = $('#mSetor').value.trim(); editing.rate = rate; editing.oeeTarget = meta; editingId = null; }
    else db.machines.push({ id: uid(), name, sector: $('#mSetor').value.trim(), rate, oeeTarget: meta });
    save(); render();
  };
  if (editing) $('#mCancelEdit').onclick = () => { editingId = null; render(); };
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editingId = b.dataset.edit; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const m = machineById(b.dataset.del);
    openSheet(`<h3>Excluir “${esc(m.name)}”?</h3>
      <p class="hint">Os apontamentos já feitos desta máquina continuam no histórico.</p>
      <button class="btn danger" id="dmY">Sim, excluir</button><button class="btn ghost" id="dmN">Voltar</button>`);
    $('#dmY').onclick = () => {
      if (db.active && db.active.machineId === b.dataset.del) db.active = null;
      db.machines = db.machines.filter(x => x.id !== b.dataset.del);
      if (editingId === b.dataset.del) editingId = null;
      save(); closeSheet(); render();
    };
    $('#dmN').onclick = closeSheet;
  });
  el.querySelectorAll('[data-delr]').forEach(b => b.onclick = () => { db.reasons.splice(+b.dataset.delr, 1); save(); render(); });
  el.querySelectorAll('[data-editr]').forEach(b => b.onclick = () => openReasonEditSheet(+b.dataset.editr));
  $('#rAdd').onclick = () => openReasonEditSheet(null);
  $('#cfgIdle').onchange = e => { calcCfg().idleCountsAsStop = e.target.checked; save(); };
  $('#cfgWait').onchange = e => { calcCfg().waitCountsAsStop = e.target.checked; save(); };
}

/* editor de motivo de parada: tipo (nome), descrição e planejada/não planejada */
function openReasonEditSheet(idx) {
  const r = idx != null ? db.reasons[idx] : { name: '', desc: '', planned: false };
  openSheet(`<h3>${idx != null ? 'Editar' : 'Novo'} motivo de parada</h3>
    <div class="field"><label for="reName">Tipo (nome)</label>
      <input id="reName" value="${esc(r.name)}" placeholder="Ex.: Setup / Troca"></div>
    <div class="field"><label for="reDesc">Descrição</label>
      <input id="reDesc" value="${esc(r.desc || '')}" placeholder="Ex.: troca de produto, ferramenta ou lote"></div>
    <div class="field" style="margin-bottom:4px"><label>Classificação</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn ghost" id="rePlan">📅 Planejada</button>
        <button class="btn ghost" id="reUnplan">⚠️ Não planejada</button>
      </div></div>
    <div class="field" id="stdField"><label for="reStd">Tempo padrão (minutos)</label>
      <input id="reStd" type="number" inputmode="decimal" min="0" step="any" placeholder="Ex.: 2" value="${r.stdMin > 0 ? r.stdMin : ''}">
      <span class="hint">O que passar do tempo padrão conta como <b>não planejado</b> — é a variação operacional. Deixe vazio para não limitar.</span></div>
    <div class="field"><label>Aplica-se a</label>
      <div class="pick-grid" id="reMachines">
        <button class="pick" data-mid="all">Todas as máquinas</button>
        ${db.machines.map(m => `<button class="pick" data-mid="${m.id}">${esc(m.name)}</button>`).join('')}
      </div>
      <span class="hint">Escolha uma, várias ou todas — o motivo só aparece ao apontar nas máquinas selecionadas.</span></div>
    <button class="btn" id="reSave">Salvar</button>
    <button class="btn ghost" id="reCancel">Cancelar</button>`);
  let planned = !!r.planned;
  let mids = Array.isArray(r.machineIds) ? r.machineIds.filter(id => machineById(id)) : [];
  const paint = () => {
    $('#rePlan').style.cssText = planned ? 'background:var(--accent);color:var(--btn-ink)' : '';
    $('#reUnplan').style.cssText = planned ? '' : 'background:var(--bad);color:var(--btn-ink)';
    $('#stdField').style.display = planned ? '' : 'none';
    $('#reMachines').querySelectorAll('.pick').forEach(b => {
      const on = b.dataset.mid === 'all' ? mids.length === 0 : mids.includes(b.dataset.mid);
      b.classList.toggle('on', on);
    });
  };
  $('#reMachines').querySelectorAll('.pick').forEach(b => b.onclick = () => {
    const id = b.dataset.mid;
    if (id === 'all') mids = [];
    else mids = mids.includes(id) ? mids.filter(x => x !== id) : [...mids, id];
    paint();
  });
  paint();
  $('#rePlan').onclick = () => { planned = true; paint(); };
  $('#reUnplan').onclick = () => { planned = false; paint(); };
  $('#reCancel').onclick = closeSheet;
  $('#reSave').onclick = () => {
    const name = $('#reName').value.trim();
    if (!name) { $('#reName').focus(); return; }
    const desc = $('#reDesc').value.trim();
    const stdMin = planned ? (parseFloat($('#reStd').value) > 0 ? parseFloat($('#reStd').value) : null) : null;
    const machineIds = mids.length ? mids : null;
    if (idx != null) Object.assign(db.reasons[idx], { name, desc, planned, stdMin, machineIds });
    else db.reasons.push({ id: uid(), name, desc, planned, stdMin, machineIds });
    save(); closeSheet(); render();
  };
}

/* =====================================================
   RELATÓRIO EXECUTIVO (one page — PNG / PDF)
   ===================================================== */
let lastReportSVG = '';

function reportData() {
  const from = periodStart(db.period);
  const done = db.sessions.filter(s => s.end >= from);
  const all = db.active ? [...done, db.active] : done;
  const agg = aggregate(all);
  const machines = db.machines.filter(m => all.some(s => s.machineId === m.id));
  const targets = machines.map(targetOf);
  const target = targets.length ? targets.reduce((a, b) => a + b, 0) / targets.length : DEFAULT_OEE_TARGET;
  const perMachine = machines.map(m => {
    const sess = all.filter(s => s.machineId === m.id);
    const ag = aggregate(sess);
    return { m, ag, o: oeeOf(ag) };
  });
  return { done, all, agg, o: oeeOf(agg), target, maint: maintStats(all), perMachine };
}

/* SVG desenhado com cores fixas (superfície clara) — imprime bem e exporta para PNG sem depender do tema */
function buildReportSVG(d) {
  const W = 1123, H = 794; /* A4 paisagem @96dpi */
  const C = { page: '#f7f6f3', card: '#ffffff', ink: '#0b0b0b', ink2: '#52514e', muted: '#898781',
    grid: '#e1e0d9', track: '#eceae4', accent: '#2a78d6', good: '#0ca30c', bad: '#d03b3b',
    prod: '#2a78d6', stop: '#e34948', idle: '#4a3aa7', wait: '#eda100' };
  const FONT = `system-ui,-apple-system,'Segoe UI',sans-serif`;
  const fmtP = v => v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%';
  const tr = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  const txt = (x, y, t, sz, w, fill, anchor) =>
    `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" fill="${fill}" text-anchor="${anchor || 'start'}" font-family="${FONT}">${esc(t)}</text>`;
  const card = (x, y, w, h, title) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${C.card}" stroke="${C.grid}"/>` +
    txt(x + 16, y + 26, title.toUpperCase(), 11, 700, C.ink2);
  const tile = (x, y, w, label, value, sub, valueColor) =>
    `<rect x="${x}" y="${y}" width="${w}" height="74" rx="10" fill="${C.page}" stroke="${C.grid}"/>` +
    txt(x + 12, y + 20, label, 10, 700, C.muted) +
    txt(x + 12, y + 48, value, 19, 800, valueColor || C.ink) +
    (sub ? txt(x + 12, y + 65, sub, 9.5, 600, C.muted) : '');
  const donut = (cx, cy, r, sw, v, color, big, small) => {
    const c = 2 * Math.PI * r, vv = Math.max(0, Math.min(1, v || 0));
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.track}" stroke-width="${sw}"/>` +
      `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
        stroke-dasharray="${(vv * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>` +
      txt(cx, cy + 2, big, 23, 800, C.ink, 'middle') +
      txt(cx, cy + 20, small, 10, 700, C.muted, 'middle');
  };
  const bar = (x, y, w, h, frac, color) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${C.track}"/>` +
    `<rect x="${x}" y="${y}" width="${Math.max(2, w * Math.max(0, Math.min(1, frac))).toFixed(1)}" height="${h}" rx="${h / 2}" fill="${color}"/>`;

  const { agg, o, target, maint, perMachine, done } = d;
  const oeeCol = o.oee == null ? C.accent : (o.oee * 100 >= target ? C.good : C.bad);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s += `<rect width="${W}" height="${H}" fill="${C.page}"/>`;

  /* cabeçalho */
  s += txt(24, 42, 'Relatório Executivo — Produção', 21, 800, C.ink);
  s += txt(24, 62, `Período: ${PERIODS[db.period][0]} · ${perMachine.length} máquina(s) · ${done.length} apontamento(s)`, 12, 600, C.ink2);
  s += txt(W - 24, 40, `Gerado em ${new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`, 11, 600, C.ink2, 'end');
  s += txt(W - 24, 58, `MES v${APP_VERSION}`, 11, 700, C.muted, 'end');

  const y1 = 78, h1 = 236, y2 = y1 + h1 + 12, h2 = 212, y3 = y2 + h2 + 12, h3 = 216;

  /* ---- OEE: máquina × real ---- */
  s += card(24, y1, 352, h1, 'OEE — máquina × real (linha)');
  const oeeMCol = o.oeeM == null ? C.accent : (o.oeeM * 100 >= target ? C.good : C.bad);
  s += donut(108, y1 + 96, 52, 14, o.oeeM, oeeMCol, fmtP(o.oeeM), 'MÁQUINA');
  s += donut(292, y1 + 96, 52, 14, o.oee, oeeCol, fmtP(o.oee), 'REAL');
  s += txt(108, y1 + 166, `meta ${target.toFixed(0)}%${o.oeeM != null ? (o.oeeM * 100 >= target ? ' · ✓' : ' · abaixo') : ''}`, 10, 700, o.oeeM == null ? C.muted : oeeMCol, 'middle');
  s += txt(292, y1 + 166, o.excl > 0 ? `inclui ${fmtDurLong(o.excl)} de fora` : 'toda a janela', 10, 700, C.muted, 'middle');
  [['Disponibilidade (máq. / real)', o.Am, `${fmtP(o.Am)} / ${fmtP(o.A)}`],
   ['Performance', o.P, fmtP(o.P)],
   ['Qualidade', o.Q, fmtP(o.Q)]].forEach(([lbl, v, val], i) => {
    const ry = y1 + 192 + i * 16;
    s += txt(40, ry, lbl, 10, 600, C.muted);
    s += txt(360, ry, val, 10.5, 800, C.ink, 'end');
  });

  /* ---- Pareto de paradas ---- */
  s += card(392, y1, 356, h1, 'Paradas — Pareto');
  const reasons = Object.entries(agg.reasons).sort((a, b) => b[1].ms - a[1].ms);
  const stopTotal = reasons.reduce((t, r) => t + r[1].ms, 0) || 1;
  if (!reasons.length) s += txt(408, y1 + 60, 'Nenhuma parada no período.', 12, 600, C.muted);
  let cum = 0;
  reasons.slice(0, 5).forEach(([name, e], i) => {
    cum += e.ms;
    const ry = y1 + 58 + i * 34;
    const planned = e.plannedMs + e.excessMs >= e.ms / 2;
    s += `<text x="408" y="${ry}" font-size="11.5" font-weight="700" fill="${C.ink}" font-family="${FONT}">${esc(tr(name, 17))} <tspan font-size="8" fill="${planned ? C.accent : C.bad}">${planned ? 'PLAN.' : 'NÃO PLAN.'}</tspan></text>`;
    s += `<text x="${392 + 356 - 16}" y="${ry}" font-size="10.5" font-weight="700" fill="${C.ink}" text-anchor="end" font-family="${FONT}">${esc(fmtDurLong(e.ms))} · ${Math.round(e.ms / stopTotal * 100)}% <tspan fill="${C.muted}" font-weight="600">(Σ ${Math.round(cum / stopTotal * 100)}%)</tspan></text>`;
    if (planned && e.excessMs > 0) {
      /* barra bicolor: dentro do padrão (azul) + estouro (vermelho) */
      const bw = (356 - 32) * e.ms / reasons[0][1].ms;
      s += `<rect x="408" y="${ry + 7}" width="${356 - 32}" height="6" rx="3" fill="${C.track}"/>`;
      s += `<rect x="408" y="${ry + 7}" width="${(bw * e.plannedMs / e.ms).toFixed(1)}" height="6" rx="3" fill="${C.accent}"/>`;
      s += `<rect x="${(408 + bw * e.plannedMs / e.ms).toFixed(1)}" y="${ry + 7}" width="${(bw * e.excessMs / e.ms).toFixed(1)}" height="6" fill="${C.bad}"/>`;
      s += txt(392 + 356 - 16, ry + 24, `+${fmtDurLong(e.excessMs)} de estouro do tempo padrão`, 8.5, 700, C.bad, 'end');
    } else {
      s += bar(408, ry + 7, 356 - 32, 6, e.ms / reasons[0][1].ms, planned ? C.accent : C.stop);
    }
  });
  if (reasons.length > 5) {
    const rest = reasons.slice(5).reduce((t, r) => t + r[1].ms, 0);
    s += txt(408, y1 + 58 + 5 * 34, `+ ${reasons.length - 5} outros motivos · ${fmtDurLong(rest)}`, 10.5, 600, C.muted);
  }

  /* ---- Produção ---- */
  s += card(764, y1, 335, h1, 'Produção');
  const diff = agg.real - agg.theo;
  s += tile(778, y1 + 42, 148, 'TEÓRICA', fmtInt(agg.theo) + ' pçs');
  s += tile(936, y1 + 42, 148, 'REAL', fmtInt(agg.real) + ' pçs');
  const avgMin = agg.t.prod > 0 ? agg.real / (agg.t.prod / 60000) : 0;
  s += tile(778, y1 + 126, 148, 'MÉDIA REAL', fmtInt(avgMin) + ' pçs/min', `refugo ${fmtInt(agg.scrap)} pçs`);
  s += tile(936, y1 + 126, 148, 'MICROPARADAS', o.microMs != null ? fmtDurLong(o.microMs) : '—', 'ritmo perdido', C.bad);
  s += txt(778, y1 + 216, `Diferença real − teórica: ${(diff >= 0 ? '+' : '') + fmtInt(diff)} pçs`, 10, 700, diff >= 0 ? C.good : C.bad);
  s += txt(778, y1 + 228, o.effMs != null
    ? `Para ${fmtInt(agg.real)} pçs bastariam ${fmtDurLong(o.effMs)} de produção.`
    : 'Nenhum apontamento finalizado no período', 9.5, 600, C.muted);

  /* ---- Distribuição do tempo ---- */
  s += card(24, y2, 352, h2, 'Distribuição do tempo');
  const tt = agg.t.total || 1;
  let sx = 40;
  const sbw = 320 - 6;
  STATE_ORDER.forEach(k => {
    const w = sbw * agg.t[k] / tt;
    if (w > 0.5) { s += `<rect x="${sx.toFixed(1)}" y="${y2 + 44}" width="${w.toFixed(1)}" height="20" rx="3" fill="${{ prod: C.prod, stop: C.stop, idle: C.idle, wait: C.wait }[k]}"/>`; sx += w + 2; }
  });
  const cfg = calcCfg();
  const outOf = k => (k === 'idle' && !cfg.idleCountsAsStop) || (k === 'wait' && !cfg.waitCountsAsStop);
  STATE_ORDER.forEach((k, i) => {
    const ry = y2 + 90 + i * 23;
    s += `<rect x="40" y="${ry - 9}" width="11" height="11" rx="3" fill="${{ prod: C.prod, stop: C.stop, idle: C.idle, wait: C.wait }[k]}"/>`;
    s += `<text x="58" y="${ry}" font-size="11" font-weight="600" fill="${C.ink2}" font-family="${FONT}">${esc(STATES[k].label)}${outOf(k) ? ` <tspan font-size="8" fill="${C.accent}">FORA DO OEE MÁQ.</tspan>` : ''}</text>`;
    s += txt(360, ry, `${fmtDurLong(agg.t[k])} · ${Math.round(agg.t[k] / tt * 100)}%`, 11, 700, C.ink, 'end');
  });
  s += txt(40, y2 + 186, 'Total medido', 11, 800, C.ink);
  s += txt(360, y2 + 186, fmtDurLong(agg.t.total), 11, 800, C.ink, 'end');
  s += txt(40, y2 + 202, o.excl > 0
    ? `Base do OEE da máquina: ${fmtDurLong(o.baseMach)} (fora ${fmtDurLong(o.excl)}).`
    : 'Base do OEE da máquina: toda a janela medida.', 9, 600, C.muted);

  /* ---- Manutenção ---- */
  s += card(392, y2, 356, h2, 'Manutenção');
  const fmtM = v => v == null ? '—' : fmtDurLong(v);
  s += tile(408, y2 + 42, 158, 'MTBF · ENTRE FALHAS ↑', fmtM(maint.mtbf), `${maint.nFail} falha(s)`);
  s += tile(576, y2 + 42, 158, 'MTBB · ENTRE QUEBRAS ↑', fmtM(maint.mtbb), `${maint.nBreak} quebra(s)`);
  s += tile(408, y2 + 126, 158, 'MTTA · ATENDIMENTO ↓', fmtM(maint.mtta), 'chamado → chegada');
  s += tile(576, y2 + 126, 158, 'MTTR · REPARO ↓', fmtM(maint.mttr), 'chegada → liberação');

  /* ---- Planejadas × não planejadas ---- */
  s += card(764, y2, 335, h2, 'Paradas planejadas × não planejadas');
  const st = agg.t.stop || 1;
  [['Não planejada', agg.stopUnplanned, agg.nStopUnplanned, C.bad],
   ['Planejada (no padrão)', agg.stopPlanned, agg.nStopPlanned, C.accent],
   ['Estouro do padrão', agg.stopExcess, agg.nStopExcess, '#eb6834']].forEach(([lbl, ms, n, col], i) => {
    const ry = y2 + 68 + i * 44;
    s += txt(780, ry, lbl, 11.5, 700, C.ink);
    s += txt(1083, ry, `${fmtDurLong(ms)} · ${Math.round(ms / st * 100)}% · ${n} evento(s)`, 10, 700, C.ink, 'end');
    s += bar(780, ry + 7, 303, 8, ms / st, col);
  });
  s += txt(780, y2 + 194, 'Estouro = tempo além do padrão em paradas planejadas;', 9, 600, C.muted);
  s += txt(780, y2 + 205, 'conta como não planejado (variação operacional).', 9, 600, C.muted);

  /* ---- Por máquina ---- */
  s += card(24, y3, W - 48, h3, 'Por máquina');
  const cols = [['MÁQUINA', 40, 'start'], ['OEE MÁQ.', 390, 'end'], ['OEE REAL', 480, 'end'], ['META', 550, 'end'],
    ['DISP. MÁQ.', 650, 'end'], ['PERF.', 720, 'end'], ['QUAL.', 790, 'end'], ['REAL', 870, 'end'],
    ['REFUGO', 945, 'end'], ['MICRO', 1015, 'end'], ['PARADA', 1075, 'end']];
  cols.forEach(([t, x, a]) => s += txt(x, y3 + 48, t, 9, 700, C.muted, a));
  s += `<line x1="40" y1="${y3 + 56}" x2="${W - 40}" y2="${y3 + 56}" stroke="${C.grid}"/>`;
  if (!perMachine.length) s += txt(40, y3 + 84, 'Sem dados de máquina no período.', 12, 600, C.muted);
  perMachine.slice(0, 5).forEach(({ m, ag, o: mo }, i) => {
    const ry = y3 + 78 + i * 26;
    const mT = targetOf(m);
    const oc = mo.oeeM == null ? C.ink : (mo.oeeM * 100 >= mT ? C.good : C.bad);
    s += txt(40, ry, tr(m.name + (m.sector ? ' · ' + m.sector : ''), 34), 11.5, 700, C.ink);
    s += txt(390, ry, fmtP(mo.oeeM), 12, 800, oc, 'end');
    s += txt(480, ry, fmtP(mo.oee), 11, 700, C.ink2, 'end');
    s += txt(550, ry, mT.toFixed(0) + '%', 11, 600, C.ink2, 'end');
    s += txt(650, ry, fmtP(mo.Am), 11, 600, C.ink2, 'end');
    s += txt(720, ry, fmtP(mo.P), 11, 600, C.ink2, 'end');
    s += txt(790, ry, fmtP(mo.Q), 11, 600, C.ink2, 'end');
    s += txt(870, ry, fmtInt(ag.real), 11, 600, C.ink2, 'end');
    s += txt(945, ry, fmtInt(ag.scrap), 11, 600, C.ink2, 'end');
    s += txt(1015, ry, mo.microMs != null ? fmtDurLong(mo.microMs) : '—', 11, 600, C.ink2, 'end');
    s += txt(1075, ry, fmtDurLong(ag.t.stop), 11, 600, C.ink2, 'end');
  });
  if (perMachine.length > 5) s += txt(40, y3 + 78 + 5 * 26, `+ ${perMachine.length - 5} máquina(s) não exibida(s)`, 10.5, 600, C.muted);

  /* rodapé */
  s += txt(24, H - 12, `MES — OEE = Disp. × Perf. × Qual. · OEE máquina desconta ${o.excl > 0 ? 'ociosidade/espera de outras máquinas' : 'nada (tudo conta)'} · OEE real = linha inteira`, 9.5, 600, C.muted);
  s += txt(W - 24, H - 12, 'dados registrados no aparelho', 9.5, 600, C.muted, 'end');
  s += '</svg>';
  return s;
}

  const blob = new Blob([lastReportSVG], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = 2, c = document.createElement('canvas');
    c.width = 1123 * scale; c.height = 794 * scale;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = `relatorio-mes-${new Date().toISOString().slice(0, 10)}.png`;
    a.href = c.toDataURL('image/png');
    a.click();
  };
  img.src = url;
};

/* =====================================================
   Sheet / overlay
   ===================================================== */
function openSheet(html) {
